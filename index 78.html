<html lang="en">

  <title>Store Training Tracker</title>

<style>
  :root{color-scheme:light;--ink:#172f38;--muted:#60747c;--bg:#f2f5f4;--line:#e2e9e7;--brand:#bafa74;--green:#267247;--red:#ba433e;--radius:19px;--shadow:0 4px 22px rgba(18,46,55,.055)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #559bd0;outline-offset:2px}
  [hidden]{display:none!important}
  .shell{max-width:760px;margin:auto;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .mast{background:#142d39;color:white;padding:calc(27px + env(safe-area-inset-top)) 22px 26px;border-radius:0 0 26px 26px}
  .mast-inner{max-width:680px;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px}
  .identity{display:flex;align-items:center;gap:10px;letter-spacing:.055em;font-size:13px;font-weight:800}.identity-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:#142d39;font-size:22px}
  .test-version{font-size:11px;letter-spacing:.055em;background:#2a4652;padding:7px 10px;border-radius:100px;color:#e6f1f1;font-weight:750}
  .mast label{display:block;color:#b4c9cb;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .select-row{display:flex;gap:10px;align-items:stretch}.course-select{min-width:0;flex:1;width:100%;border:1px solid #567079;border-radius:13px;background:#233f4b;color:white;padding:14px 36px 14px 15px;font-size:17px;font-weight:750;min-height:53px}.course-select option{color:#172f38;background:white}
  .add-course{flex:none;border:1px solid #bafa74;background:#bafa74;color:#132d38;border-radius:13px;padding:0 17px;font-size:25px;font-weight:700;min-width:53px;min-height:53px}
  .mast-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}.mast-bottom span{font-size:13px;color:#b4c9cb}.mast-bottom button{border:0;background:none;color:#bafa74;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:4px}
  main{padding:20px 16px 0}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;padding:20px}
  .eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.085em;font-weight:850}.course-name{font-size:clamp(23px,5vw,30px);letter-spacing:-.035em;font-weight:850;line-height:1.16;margin:7px 0 16px;overflow-wrap:anywhere}
  .due{display:inline-flex;align-items:center;gap:7px;color:#42616a;background:#f0f5f4;font-size:13px;font-weight:700;border-radius:9px;padding:8px 11px}.due.overdue{color:#a83c36;background:#fff1ee}.due.today{color:#976216;background:#fff6e3}
  .progress-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-top:24px;margin-bottom:10px}.fraction{font-size:37px;font-weight:850;letter-spacing:-.06em;line-height:1}.fraction small{font-size:19px;color:#789098;font-weight:700}.progress-desc{text-align:right;color:var(--muted);font-size:13px;font-weight:700}
  .progress-outer{background:#edf1f1;height:11px;border-radius:20px;overflow:hidden}.progress-inner{height:100%;background:linear-gradient(90deg,#8dd65f,#3d9c64);width:0%;transition:width .2s ease}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.btn{border:1px solid transparent;border-radius:13px;padding:13px 15px;min-height:50px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
  .btn.primary{background:var(--ink);color:white}.btn.secondary{background:#eef3f1;border-color:#e1e8e6;color:var(--ink)}.btn.green{background:#bafa74;color:#173a2a}.btn.danger{background:#fff1ef;color:#a63a36;border-color:#ffd4d0}.btn.ghost{background:white;border-color:var(--line);color:var(--ink)}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{font-size:19px;letter-spacing:-.025em;margin:0}.count{font-size:13px;font-weight:800;color:#a54537;background:#fff0ed;border-radius:30px;padding:5px 11px;white-space:nowrap}.count.done{color:#276e43;background:#edf7ee}
  .subline{margin:-8px 0 13px;font-size:13px;color:var(--muted)}.person-list{display:flex;flex-direction:column;gap:9px}.person{display:flex;gap:12px;align-items:center;min-height:64px;border:1px solid var(--line);border-radius:13px;padding:9px 10px 9px 8px;background:#fff}.person.done-person{background:#f8faf8}
  .tick{width:42px;height:42px;border-radius:12px;border:2px solid #b8c9c9;background:white;display:grid;place-items:center;flex:none;color:transparent;font-size:24px;font-weight:850;line-height:1}.tick.done-tick{color:white;background:#378a5f;border-color:#378a5f}.person-details{flex:1;min-width:0}.person-name{font-size:16px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}.person-note{display:block;font-size:12px;color:#855b26;margin-top:3px;overflow-wrap:anywhere}.person-edit{border:0;background:#f0f4f4;color:#54717a;border-radius:9px;min-width:36px;height:36px;font-size:17px;font-weight:850}.person-edit:active{transform:scale(.96)}
  .empty-list{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed #cedbd8;border-radius:14px;background:#fafcfb}.empty-list strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.empty-list .celebrate{font-size:32px;margin-bottom:5px}
  .completed-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;text-align:left;font-size:16px;font-weight:800;color:var(--ink);padding:2px 0}.completed-content{margin-top:16px}.chevron{font-size:18px;color:#60747c}
  .footnote{font-size:12px;color:#70848a;line-height:1.5;margin:9px 3px 0;text-align:center}.footer-link{border:0;background:none;color:#47666f;text-decoration:underline;font-size:12px;padding:8px}
  .blank{padding:26px 12px;text-align:center}.blank-icon{font-size:42px;background:#f0f7e7;width:78px;height:78px;border-radius:20px;display:grid;place-items:center;margin:2px auto 22px}.blank h1{font-size:25px;line-height:1.2;letter-spacing:-.03em;margin:0 0 9px}.blank p{font-size:15px;color:var(--muted);max-width:380px;margin:0 auto 24px}.blank .btn{width:100%;margin-bottom:10px;max-width:330px}
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(8,28,34,.64);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.modal{max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;background:white;color:var(--ink);border-radius:22px;width:min(100%,550px);padding:21px 20px 22px;box-shadow:0 20px 80px rgba(0,0,0,.24)}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px}.modal h2{margin:0;font-size:23px;letter-spacing:-.035em}.close{display:grid;place-items:center;border:0;border-radius:10px;background:#eef3f3;width:35px;height:35px;color:var(--ink);font-size:24px;font-weight:500;line-height:1}
  .field{margin:0 0 15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid #cedbd8;background:#fcfdfd;color:var(--ink);font-size:16px;min-height:50px}.field textarea{min-height:190px;resize:vertical;line-height:1.6}.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}.modal .btn{width:100%;margin-top:9px}.modal .btn:first-of-type{margin-top:3px}.preview{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:13px;background:#f1f5f3;border:1px solid #e0eae6;padding:15px;font-size:14px;line-height:1.65;max-height:39dvh;overflow:auto}.modal-inset{background:#f5f8f7;border-radius:12px;padding:13px;font-size:13px;color:#5d7479;margin:8px 0 14px}.modal-two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-two .btn{margin-top:9px}.modal hr{border:0;border-top:1px solid var(--line);margin:20px 0}.file-input{display:none}.inline-warning{color:#a23b38;font-size:13px;font-weight:700;margin:7px 0}
  .pick-list{max-height:38dvh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}.pick-person{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);font-weight:700}.pick-person:last-child{border:0}.pick-person input{width:23px;height:23px;accent-color:#267247;flex:none}
  .toast{position:fixed;z-index:80;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#193740;color:#fff;min-height:54px;border-radius:14px;display:flex;align-items:center;gap:18px;justify-content:space-between;padding:12px 14px 12px 17px;box-shadow:0 7px 38px #142d3952;width:min(calc(100% - 24px),500px);font-size:14px}.toast button{border:0;background:#bafa74;color:#142d39;border-radius:9px;font-weight:800;padding:9px 12px;flex:none}
  @media(min-width:650px){.mast{padding:38px 22px 30px}.shell main{padding:24px 16px}.card{padding:26px}.overlay{align-items:center}.modal{padding:26px}.actions .btn{font-size:15px}}
  @media(prefers-reduced-motion:reduce){.progress-inner{transition:none}}

  /* TEAM Training Academy visual edition: retains existing training and local data. */
  :root{--ink:#133463;--muted:#5c6f86;--bg:#f0f4fa;--line:#d9e3f1;--brand:#ffdf32;--green:#17825a;--red:#c84642;--shadow:0 6px 24px rgba(5,46,106,.07)}
  .mast{background:linear-gradient(155deg,#00348a,#0754b7);border-bottom:5px solid #ffd521;border-radius:0 0 27px 27px;padding-top:calc(19px + env(safe-area-inset-top))}
  .academy-banner{display:flex;align-items:center;gap:13px;margin:0 0 20px;padding:13px 13px 14px;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(255,255,255,.1)}
  .academy-emblem{flex:none;width:64px;height:64px;background:#fff;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #ffdf32}
  .academy-emblem svg path:first-child{fill:#0d48a0}.academy-emblem svg path{stroke:#0d48a0}.academy-emblem svg circle{fill:#0d48a0}
  .academy-wordmark{min-width:0}.academy-team{font-size:clamp(36px,10vw,61px);line-height:.95;letter-spacing:-.07em;font-weight:1000;color:#fff}.academy-mark{font-size:.45em;display:inline-grid;place-items:center;vertical-align:middle;letter-spacing:0;background:#ffdf32;color:#08418f;border-radius:8px;width:34px;height:34px;margin-left:7px}
  .academy-subtitle{font-size:11px;letter-spacing:.23em;font-weight:800;color:#ffdf32;margin-top:9px;white-space:nowrap}
  .topline{margin-bottom:18px}.identity-mark{background:#ffdf32;color:#06408d}.test-version{background:rgba(255,255,255,.13);color:white}.mast label,.mast-bottom span{color:#d8e5fb}
  .empty-training-choice{text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.empty-training-choice[hidden]{display:none!important}
  .course-select{background:#fff;color:#143e85;border-color:#93b3e8}.course-select option{color:#143e85}.add-course{background:#ffdf32;border-color:#ffdf32;color:#0b3b80}.mast-bottom button{color:#ffdf32}
  .card{border-color:#dce6f3}.course-name{color:#003d98}.due{background:#eaf2ff;color:#26589c}.progress-inner{background:linear-gradient(90deg,#ffdc37,#eca900)}
  .btn.primary{background:#063f97;color:#fff}.btn.secondary{background:#edf3ff;border-color:#d6e5fd;color:#17427e}.btn.green{background:#ffdb28;color:#13366c}.btn.ghost{color:#164079}
  .tick.done-tick{background:#0b65bd;border-color:#0b65bd}.count.done{background:#e5f3ff;color:#0b5aaf}.blank-icon{background:#e9f2ff}.pick-person input{accent-color:#0b59b4}
  .toast{background:#063d89}.toast button{background:#ffdf32;color:#123668}.preview{background:#f2f6fc;border-color:#d9e5f6}
  @media(max-width:360px){.academy-team{font-size:36px}.academy-subtitle{letter-spacing:.15em}.academy-emblem{width:54px;height:54px}.academy-banner{gap:10px}}
.academy-banner{justify-content:center}.academy-emblem{margin:auto}
  .overview-launch{width:100%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.13);color:white;display:flex;align-items:center;justify-content:space-between;border-radius:14px;font-weight:850;padding:13px 16px;margin:2px 0 22px;font-size:16px;min-height:52px}
  .overview-launch:active{background:rgba(255,255,255,.24)}
  .due.today{background:#fff2d1;color:#895b00}.due.overdue{background:#ffebec;color:#b72733}.overview-entry{border:1px solid #d6e5fa;border-radius:13px;padding:15px;margin:11px 0;background:#f8fbff}
  .overview-title{font-weight:850;font-size:17px;color:#063f97;overflow-wrap:anywhere}
  .overview-due{font-size:14px;margin:8px 0;color:#173f79;font-weight:650}
  .overview-days{color:#c52a36;font-weight:900}
  .overview-completed{font-size:14px;font-weight:800;color:#153e70}
  .overview-entry .overview-open{margin-top:10px;width:100%}
  .overview-empty{text-align:center;color:#60747c;padding:20px 5px}
  .site-photo{display:flex;justify-content:center;margin:0 auto 18px}
  .site-photo img{display:block;width:112px;height:112px;object-fit:cover;border-radius:22px;box-shadow:0 5px 15px rgba(0,0,0,.14)}
.profile-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 17px}.profile-choice{border:1px solid #cbdcf1;border-radius:16px;background:#edf3ff;color:#17427e;min-height:128px;padding:12px 10px;font-size:18px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.05}.profile-choice.selected{border:2px solid #0754b7;background:#dbeaff}.profile-choice:active{transform:scale(.98)}.profile-icon{display:flex;align-items:center;justify-content:center;height:58px}.profile-icon svg{width:72px;height:58px;stroke:#111;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.profile-text{display:block}.icon-picker{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 8px;scroll-snap-type:x proximity}.icon-choice{flex:0 0 auto;width:88px;height:88px;border:2px solid #d6e3f5;border-radius:18px;background:#f7fbff;padding:4px;display:grid;place-items:center;scroll-snap-align:start}.icon-choice.selected{border-color:#0b5eb7;background:#e9f2ff;box-shadow:0 0 0 2px rgba(11,94,183,.08)}.icon-choice img{display:block;width:76px;height:76px;border-radius:14px;object-fit:cover}.tiny-btn{padding:12px 14px;font-size:15px}.option-panel{border:1px solid #d8e5f6;background:#f8fbff;border-radius:18px;padding:14px;margin:10px 0 14px}.option-panel[hidden]{display:none!important}

.saved-profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.saved-profile-btn{border:2px solid #d6e3f5;border-radius:15px;background:#f7fbff;padding:9px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#153c73;font-weight:850;font-size:13px;min-width:0}.saved-profile-btn img{height:76px;width:76px;object-fit:cover;border-radius:12px}.saved-profile-btn .profile-fallback{height:76px;width:76px;display:grid;place-items:center;font-size:33px}.saved-profile-btn small{font-size:10px;color:#667a8e;font-weight:600}.saved-profile-btn:active{background:#deedff}.saved-profiles-empty{font-size:13px;color:#61758c}
</style>

<script>
(function(){'use strict';
  const KEY='training-tracker-v1';
  const $=id=>document.getElementById(id);
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const makeId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
  let state={trainings:[],activeId:null,groups:{store:[],managers:[],cat5:[],bakery:[],freshness:[],nonfood:[],mentors:[]},customLists:[],profileAbsences:{},formerColleagues:[]},lastUndo=null,completedExpanded=false,toastTimer=null,previousFocus=null;
  function isValidDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00'))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s}
  function cleanNames(raw){const seen=new Set();return (Array.isArray(raw)?raw:[]).filter(x=>typeof x==='string').map(x=>x.trim().slice(0,120)).filter(x=>{const k=x.toLocaleLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,500)}
  function normalise(raw){if(!raw||!Array.isArray(raw.trainings))return null;const trainings=[];const ids=new Set();for(const t of raw.trainings.slice(0,1000)){if(!t||typeof t.title!=='string'||!t.title.trim())continue;let id=typeof t.id==='string'&&t.id.length<120?t.id:makeId();if(ids.has(id))id=makeId();ids.add(id);const seen=new Set();const people=[];for(const p of Array.isArray(t.people)?t.people.slice(0,5000):[]){if(!p||typeof p.name!=='string'||!p.name.trim())continue;const key=p.name.trim().toLocaleLowerCase();if(seen.has(key))continue;seen.add(key);people.push({id:typeof p.id==='string'&&p.id.length<120?p.id:makeId(),name:p.name.trim().slice(0,120),done:p.done===true,completedAt:typeof p.completedAt==='string'?p.completedAt:'',note:typeof p.note==='string'?p.note.slice(0,240):'',absence:(p.absence&&['sick','holiday'].includes(p.absence.type)&&(p.absence.until==null||p.absence.until===''||isValidDate(p.absence.until)))?{type:p.absence.type,until:p.absence.until}:null});}trainings.push({id,title:t.title.trim().slice(0,150),due:isValidDate(t.due)?t.due:'',people,archived:t.archived===true});}return{trainings,profileAbsences:(raw.profileAbsences&&typeof raw.profileAbsences==='object'&&!Array.isArray(raw.profileAbsences))?raw.profileAbsences:{},formerColleagues:cleanNames(raw.formerColleagues),activeId:trainings.some(t=>t.id===raw.activeId)?raw.activeId:(trainings[0]?.id||null),groups:{store:cleanNames(raw.groups?.store),managers:cleanNames(raw.groups?.managers),cat5:cleanNames(raw.groups?.cat5),bakery:cleanNames(raw.groups?.bakery),freshness:cleanNames(raw.groups?.freshness),nonfood:cleanNames(raw.groups?.nonfood),mentors:cleanNames(raw.groups?.mentors)},customLists:(Array.isArray(raw.customLists)?raw.customLists:[]).filter(c=>c&&typeof c.name==='string'&&c.name.trim()).slice(0,100).map(c=>({id:typeof c.id==='string'?c.id:makeId(),name:c.name.trim().slice(0,120),created:isValidDate(c.created)?c.created:new Date().toISOString().slice(0,10),names:cleanNames(c.names),iconId:typeof c.iconId==='string'?c.iconId:'',buttonText:typeof c.buttonText==='string'?c.buttonText.trim().slice(0,120):''}))}}
  try{const raw=localStorage.getItem(KEY);if(raw)state=normalise(JSON.parse(raw))||state}catch(e){console.warn('Could not read saved training',e)}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){showToast('Unable to save. Check browser storage.');return false}}
  function active(){return state.trainings.find(t=>t.id===state.activeId&&!t.archived)||null}
  function currentCourses(){return state.trainings.filter(t=>!t.archived)}
  function profileKey(name){return name.trim().toLocaleLowerCase()}
  function getAbsence(p){return state.profileAbsences[profileKey(p.name)]||p.absence||null}
  function setAbsence(p,a){const key=profileKey(p.name);if(a)state.profileAbsences[key]=a;else delete state.profileAbsences[key];for(const t of state.trainings)for(const q of t.people)if(profileKey(q.name)===key)q.absence=a}
  function reconcileActive(){if(!active())state.activeId=currentCourses()[0]?.id||null}
  
  function fmtDate(iso){if(!isValidDate(iso))return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
  function dueStatus(iso){if(!iso)return'';const n=daysUntil(iso);return n<=3?'overdue':n<=7?'today':''}
  function shortDue(iso){const st=dueStatus(iso);return st==='overdue'?'Overdue · '+fmtDate(iso):st==='today'?'Due today · '+fmtDate(iso):'Deadline · '+fmtDate(iso)}
  function render(){for(const t of state.trainings)for(const p of t.people){const k=profileKey(p.name);if(!state.profileAbsences[k]&&p.absence)state.profileAbsences[k]=p.absence;else if(state.profileAbsences[k])p.absence=state.profileAbsences[k]}reconcileActive();const selected=active();const selector=$('courseSelect');selector.innerHTML=currentCourses().length?currentCourses().map(t=>'<option value="'+escapeHTML(t.id)+'" '+(t.id===state.activeId?'selected':'')+'>'+escapeHTML(t.title)+'</option>').join(''):'<option value="">No training added</option>';selector.hidden=!currentCourses().length;$('emptyTrainingChoice').hidden=!!currentCourses().length;selector.disabled=!currentCourses().length;$('editCourse').hidden=!selected;$('headerMessage').textContent=selected?currentCourses().length+' training '+(currentCourses().length===1?'course':'courses')+' saved on this device.':'Stay on top of colleague training.';
    const main=$('mainContent');if(!selected){main.innerHTML='<section class="card blank"><div class="blank-icon" aria-hidden="true">📋</div><h1>Start your training list</h1><p>Add a training course, set a deadline, then paste your colleague names. Tick someone off and they disappear from the outstanding list.</p><button class="btn primary" id="startCourse" type="button">+ Create training</button><button class="btn secondary" id="manageGroups" type="button">⚙ Manage default colleague lists</button></section><p class="footnote">Training is saved to this browser, not to a shared online database.</p>';return}
    const done=selected.people.filter(p=>p.done),pending=selected.people.filter(p=>!p.done).sort((a,b)=>Number(absenceAtBottom(a))-Number(absenceAtBottom(b))),total=selected.people.length,pct=total?Math.round(done.length/total*100):0;
    const pendingList=pending.length?'<div class="person-list">'+pending.map(p=>personHTML(p,false)).join('')+'</div>':'<div class="empty-list"><div class="celebrate">'+(total?'🎉':'👥')+'</div><strong>'+(total?'Everyone is complete!':'No colleagues added yet')+'</strong>'+(total?'All names are ticked off.':'Use “Add colleagues” to create your list.')+'</div>';
    main.innerHTML='<section class="card"><div class="eyebrow">Training course</div><h1 class="course-name">'+escapeHTML(selected.title)+'</h1><div class="due '+dueStatus(selected.due)+'">'+(selected.due?('◷ '+escapeHTML(shortDue(selected.due))):'◷ No deadline set')+'</div><div class="progress-head"><div class="fraction">'+done.length+'<small> / '+total+'</small></div><div class="progress-desc">COMPLETED<br>'+pending.length+' outstanding</div></div><div class="progress-outer" role="progressbar" aria-label="Training completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="progress-inner" style="width:'+pct+'%"></div></div><div class="actions"><button type="button" class="btn secondary" id="addPeople">＋ Add colleagues</button><button type="button" class="btn green" id="publish" >↗ Publish</button></div></section>'+ 
      '<section class="card"><div class="section-head"><h2>Still to complete</h2><span class="count">'+pending.length+' remaining</span></div><p class="subline">Tap the square beside a name when their training is finished.</p><div class="field"><input id="nameSearch" type="search" placeholder="Search colleagues…" aria-label="Search colleagues"></div><button class="btn secondary" type="button" id="availableOnly">Show available only: Off</button><div id="pendingResults">'+pendingList+'</div></section>'+ 
      (done.length?'<section class="card"><button type="button" class="completed-toggle" id="toggleCompleted" aria-expanded="'+completedExpanded+'"><span>✓ Completed colleagues <span class="count done">'+done.length+'</span></span><span class="chevron">'+(completedExpanded?'⌃':'⌄')+'</span></button>'+(completedExpanded?'<div class="completed-content person-list">'+done.map(p=>personHTML(p,true)).join('')+'</div>':'')+'</section>':'')+ 
      '<div style="text-align:center"><button type="button" class="btn secondary" id="colleagueOverview">👥 Colleague overview</button> <button type="button" class="btn secondary" id="staffManage">Manage staff</button> <button type="button" class="btn secondary" id="manageGroups">⚙ Manage default colleague lists</button></div><p class="footnote">Your progress saves automatically on this device. <button class="footer-link" id="openData" type="button">Backup / restore</button></p>';
  }
  function daysUntil(iso){
    if(!isValidDate(iso))return null;
    const now=new Date();

  // Conservative import checks: only discard clearly non-person prose.

  const nicknameWords=new Set(['monkey','donkey','tiger','bear','fox','boss','king','queen','banana','chief','buddy','mate','big man','little man','unknown','someone','staff','team','manager']);
  function classifyImport(name,original,roster){
    const n=name.trim(),lower=n.toLocaleLowerCase(),words=n.split(/\s+/);
    if(roster.has(lower))return 'name';
    if(/^(?:hi|hello|hey|morning|afternoon|evening|dear|thanks|thank you|please|regards|cheers)\b/i.test(n)||
       /\b(?:guys below|here is|here are|the following|an update|training[s]? for this|colleagues (?:are|who|have|need)|to complete|to comple|this month|see below|please (?:complete|do)|has(?:n't| not)? completed)\b/i.test(n)||
       /[.!?]$/.test(n)&&words.length>=5||
       words.length>=7)return 'ignore';
    if(nicknameWords.has(lower)||/^(?:nickname|aka)\b/i.test(n)||/\b(?:the donkey|the monkey)\b/i.test(n))return 'review';
    if(words.length>=4||/\d/.test(n)&&!roster.has(lower))return 'review';
    return 'name';
  }

  function parseLines(raw){
    const entries=[], ignored=[],review=[];
    const lines=String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const hasStatus=lines.some(s=>/[☑✅✔✓🔴❌]/u.test(s));
    const roster=new Set([...Object.values(state.groups).flat(),...(state.customLists||[]).flatMap(c=>c.names),...(active()?.people||[]).map(p=>p.name)].map(n=>n.toLocaleLowerCase()));
    const timing=/\b(?:today|tonight|tomorrow|yesterday|next\s+week|this\s+week|next\s+(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)|(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?))\b/i;
    const noteWords=/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?/i;
    for(let i=0;i<lines.length;i++){
      const original=lines[i];
      if(/^\d+\s*\/\s*\d+(?:\s+completed)?$/i.test(original)||/^(?:completed|outstanding|deadline|remaining|still to complete|training)\s*:/i.test(original)||/^(?:still to complete|completed colleagues)$/i.test(original)){ignored.push(original);continue}
      const icons=/[☑✅✔✓🔴❌]/u.test(original);
      let line=original.replace(/^[\s\-*•]+/,'').replace(/[☑✅✔✓🔴❌\uFE0E\uFE0F]/gu,'').replace(/^\*+(?=\S)/,'').trim();
      if(!line){ignored.push(original);continue}
      // Headings such as "LOS Video 6 Minutes:", "*Modern slavery*" and "Training: Food safety"
      // are not colleagues. Only use stronger title cues so unusual real names survive.
      if(!icons&&!roster.has(line.toLocaleLowerCase())&&(
        (i===0&&hasStatus&&/^\*[^*]+\*$/.test(original))||
        (i===0&&hasStatus&&/^(?:modern slavery|food safety|manual handling|health and safety|six monthly refresher|6 monthly refresher)$/i.test(line))||
        /^(?:training|course|module|subject)\s*[:\-]/i.test(line)||
        /^(?:los|health\s*(?:and|&)\s*safety|food\s+safety|modern\s+slavery)\b.*(?:video|minutes?|training|refresher|:)\s*:?\s*$/i.test(line)||
        /^(?:.+\b(?:video|training|refresher|induction)\b.{0,50}:)$/i.test(line)
      )){ignored.push(original);continue}
      const done=/[☑✅✔✓]/u.test(original)&&!/[🔴❌]/u.test(original);
      let note='';
      const starred=line.match(/\s+\*([^*]+)\*\s*$/);
      if(starred){note=starred[1].trim();line=line.slice(0,starred.index).trim()}
      else{
        const dash=line.match(/\s+[-–—]\s+(.+)$/);
        if(dash){note=dash[1].trim();line=line.slice(0,dash.index).trim()}
      }
      // "Katie Sunday", "Nicholas *Friday*", "April to do tomorrow" =>
      // keep the colleague name, store when they intend to do it as a note.
      if(!note){
        const parts=line.split(/\s+/);
        for(let cut=1;cut<parts.length;cut++){
          const candidate=parts.slice(cut).join(' ').replace(/^[,;:() ]+|[,;:() ]+$/g,'');
          if(timing.test(candidate)&&noteWords.test(candidate)&&/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?(?:(?:this|next)\s+)?(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?|today|tonight|tomorrow|yesterday|week)(?:\s+.*)?$/i.test(candidate)){
            const base=parts.slice(0,cut).join(' ');
            // avoid splitting a known full colleague name
            if(!roster.has(line.toLocaleLowerCase())&&(roster.has(base.toLocaleLowerCase())||cut===1||/^(?:to|on|by|for|due|next|this)\b/i.test(parts[cut]))){
              line=base;note=candidate;break;
            }
          }
        }
      }
      line=line.replace(/^\*+|\*+$/g,'').trim();
      if(!line||/^\d+\s*\/\s*\d+$/.test(line)){ignored.push(original);continue}
      const decision=classifyImport(line,original,roster);
      if(decision==='ignore'){ignored.push(original);continue}
      (decision==='review'?review:entries).push({name:line.slice(0,120),done,note:note.slice(0,240)});

    }
    return {entries,review,skipped:ignored.length,ignored};
  }

  function customListButtonLabel(list){return (list?.buttonText||'').trim()||(list?.name||'').trim()}
  function customListDisplayLabel(list,withDate=false){if(!list)return '';const base=customListButtonLabel(list)||list.name;return withDate?base+' (created '+fmtDate(list.created)+')':base}
  function iconPickerHTML(inputId,pickerId,selectedId=''){return '<div class="field"><label>Choose an icon (optional)</label><input type="hidden" id="'+inputId+'" value="'+escapeHTML(selectedId||'')+'"><div class="icon-picker" id="'+pickerId+'">'+customIconLibrary.map(icon=>'<button type="button" class="icon-choice'+(icon.id===selectedId?' selected':'')+'" data-icon-id="'+icon.id+'" aria-label="Choose icon"><img src="'+icon.src+'" alt=""></button>').join('')+'</div><p class="hint">Scroll the icons and tap one to use it. Writing is optional.</p></div>'}
  function bindIconPicker(pickerId,inputId){const picker=$(pickerId),input=$(inputId);if(!picker||!input)return;picker.onclick=e=>{const button=e.target.closest('[data-icon-id]');if(!button)return;const next=button.dataset.iconId;const same=input.value===next;input.value=same?'':next;picker.querySelectorAll('[data-icon-id]').forEach(el=>el.classList.toggle('selected',!same&&el===button));};}
  function bindOptionalButtonText(toggleId,wrapId,inputId,prefill=''){const toggle=$(toggleId),wrap=$(wrapId),input=$(inputId);if(!toggle||!wrap||!input)return;const sync=()=>{const has=input.value.trim().length>0;wrap.hidden=!has && !wrap.dataset.forceOpen;toggle.textContent=has||wrap.dataset.forceOpen==='true'?'Hide button text':'Add / edit button text';};toggle.onclick=()=>{wrap.dataset.forceOpen=wrap.hidden?'true':'false';wrap.hidden=!wrap.hidden;if(!wrap.hidden)setTimeout(()=>input.focus(),30);sync();};if(prefill){wrap.hidden=false;wrap.dataset.forceOpen='true';}input.addEventListener('input',sync);sync();}

  function profileButtonHTML(key,name){return '<button class="profile-choice" type="button" data-profile="'+escapeHTML(key)+'"><span class="profile-icon">'+profileIconSVG(key)+'</span><span class="profile-text">'+escapeHTML(name)+'</span></button>'}
  function savedProfilesHTML(){const profiles=state.customLists||[];if(!profiles.length)return '<p class="saved-profiles-empty">No custom profiles saved yet.</p>';return '<div class="saved-profiles">'+profiles.map(c=>{const icon=customIconLibrary.find(i=>i.id===c.iconId);return '<button type="button" class="saved-profile-btn" data-saved-profile="'+escapeHTML(c.id)+'">'+(icon?'<img src="'+icon.src+'" alt="">':'<span class="profile-fallback">👥</span>')+'<span>'+escapeHTML(customListButtonLabel(c)||c.name)+'</span><small>Created '+escapeHTML(fmtDate(c.created))+'</small></button>'}).join('')+'</div>'}
  function showCustomProfileEditor(){
    openModal(modalHeader('New custom profile')+
      '<div class="field"><label for="profileName">Profile name</label><input id="profileName" maxlength="120" autocomplete="off"></div>'+
      iconPickerHTML('profileIconId','profileIconPicker','')+
      '<button class="btn secondary tiny-btn" type="button" id="toggleProfileButtonText">Add / edit button text</button>'+
      '<div class="field option-panel" id="profileButtonTextWrap" hidden><label for="profileButtonText">Button text (optional)</label><input id="profileButtonText" maxlength="120" autocomplete="off" placeholder="e.g. Bakery cover"><p class="hint">Leave blank if you only want the icon and profile name.</p></div>'+
      '<div class="field"><label for="profileNames">Colleagues (one name per line)</label><textarea id="profileNames"></textarea></div>'+
      '<button class="btn primary" type="button" id="saveCustomProfile">Save custom profile</button><button class="btn secondary" type="button" id="backProfile">Back to profiles</button>','profileName');
    bindIconPicker('profileIconPicker','profileIconId');
    bindOptionalButtonText('toggleProfileButtonText','profileButtonTextWrap','profileButtonText');
    $('backProfile').onclick=showGroupEditor;
    $('saveCustomProfile').onclick=()=>{const name=$('profileName').value.trim(),names=cleanNames(parseLines($('profileNames').value).entries.map(e=>e.name)),buttonText=$('profileButtonText').value.trim(),iconId=$('profileIconId').value.trim();if(!name){showToast('Enter a profile name');return}if(!names.length){showToast('Add at least one colleague');return}if((state.customLists||[]).some(c=>c.name.toLocaleLowerCase()===name.toLocaleLowerCase())){showToast('Profile name already exists');return}const date=new Date(),created=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');state.customLists=state.customLists||[];state.customLists.push({id:makeId(),name,created,names,iconId,buttonText});save();closeModal();showToast('Saved '+name+' ('+names.length+' colleagues)')};
  }
  function showGroupEditor(){
    const groupOptions=Object.entries(groupLabels).map(([key,name])=>'<option value="'+key+'">'+escapeHTML(name)+'</option>').join('');
    openModal(modalHeader('Colleague profiles')+'<p class="hint">Select a profile, add its colleagues and save. Store team and Managers retain your existing lists. Other profiles are reusable for new training.</p><div class="profile-buttons" id="profileButtons">'+Object.entries(groupLabels).map(([key,name])=>profileButtonHTML(key,name)).join('')+profileButtonHTML('custom','Custom')+'</div><h3>Saved custom profiles</h3>'+savedProfilesHTML()+'<div class="field"><label for="editGroup">Selected profile</label><select id="editGroup">'+groupOptions+'</select></div><div class="field"><label for="groupNames">Colleagues (one name per line)</label><textarea id="groupNames"></textarea><p class="hint" id="groupCount"></p></div><button type="button" class="btn primary" id="saveGroup">Save profile</button>','editGroup');
    const load=()=>{const key=$('editGroup').value;$('groupNames').value=(state.groups[key]||[]).join('\n');$('groupCount').textContent=(state.groups[key]||[]).length+' saved colleagues';$('modal').querySelectorAll('[data-profile]').forEach(b=>b.classList.toggle('selected',b.dataset.profile===key))};
    $('editGroup').onchange=load;
    $('profileButtons').onclick=e=>{const b=e.target.closest('[data-profile]');if(!b)return;if(b.dataset.profile==='custom'){showCustomProfileEditor();return}$('editGroup').value=b.dataset.profile;load()};load();
    $('modal').querySelectorAll('[data-saved-profile]').forEach(b=>b.onclick=()=>askRemoveSpecific(b.dataset.savedProfile));
    $('saveGroup').onclick=()=>{const key=$('editGroup').value,raw=$('groupNames').value,parsed=parseLines(raw);const entries=[...parsed.entries,...parsed.review];state.groups[key]=cleanNames(entries.map(x=>x.name));save();render();closeModal();showToast(groupLabels[key]+' saved: '+state.groups[key].length+' colleagues')};
  }
  function addEntries(entries){const course=active();if(!course)return;const seen=new Set(course.people.map(p=>p.name.toLocaleLowerCase()));let added=0;for(const p of entries){const key=p.name.toLocaleLowerCase();if(seen.has(key))continue;seen.add(key);course.people.push({...p,id:makeId()});added++}save();closeModal();render();showToast(added+' colleagues added');}
  function askRemoveSpecific(groupKey){
    const saved=(state.customLists||[]).find(c=>c.id===groupKey);
    const names=saved?saved.names:(state.groups[groupKey]||[]);
    const label=saved?customListDisplayLabel(saved,true):groupLabels[groupKey];
    if(!names.length){showToast('No saved colleagues in this list');if(!saved)showGroupEditor();return}
    openModal(modalHeader('Remove any specific colleague?')+'<p class="hint">'+escapeHTML(label)+' · '+names.length+' colleagues. Untick anyone who does not need this training. Your saved default list will stay unchanged.</p><div class="pick-list" id="pickList">'+names.map((n,i)=>'<label class="pick-person"><input type="checkbox" data-pick="'+i+'" checked><span>'+escapeHTML(n)+'</span></label>').join('')+'</div><p class="hint" id="selectedCount"></p><button class="btn primary" type="button" id="confirmGroup">Add selected colleagues</button><button class="btn secondary" type="button" id="backGroups">Back</button>');
    const update=()=>{$('selectedCount').textContent=$('pickList').querySelectorAll('input:checked').length+' of '+names.length+' selected'};$('pickList').onchange=update;update();
    $('confirmGroup').onclick=()=>{const entries=[...$('pickList').querySelectorAll('input:checked')].map(el=>({name:names[Number(el.dataset.pick)],done:false,note:''}));if(!entries.length){showToast('Select at least one colleague');return}addEntries(entries)};
    $('backGroups').onclick=showPeopleModal;
  }
  function showCustomList(){
    const names=state.groups.store||[];
    openModal(modalHeader('Custom list')+
      '<p class="hint">Create a list for this training. You can also save it for future training courses.</p>'+
      '<div class="field"><label for="customListTitle">Name of training / custom list</label><input id="customListTitle" type="text" maxlength="120" autocomplete="off" value="'+escapeHTML(active()?.title||'')+'"></div>'+
      '<label class="pick-person" style="margin:12px 0 12px"><input type="checkbox" id="saveCustomList"><span><strong>Save custom list and colleagues</strong><small style="display:block;font-weight:normal">Makes this list an option for future training, with its creation date.</small></span></label>'+
      '<div id="saveCustomExtras" class="option-panel" hidden>'+
        iconPickerHTML('customSaveIconId','customSaveIconPicker','')+
        '<button class="btn secondary tiny-btn" type="button" id="toggleCustomSaveText">Add / edit button text</button>'+
        '<div class="field" id="customSaveTextWrap" hidden><label for="customSaveButtonText">Button text (optional)</label><input id="customSaveButtonText" maxlength="120" autocomplete="off" placeholder="e.g. Bakers"></div>'+
      '</div>'+
      '<div class="field"><label for="customPaste">Add new colleagues (one per line)</label><textarea id="customPaste" rows="3" placeholder=""></textarea></div>'+
      (names.length?'<p class="hint">Or select colleagues from Entire Store Team:</p><div class="pick-list" id="customPick">'+names.map((n,i)=>'<label class="pick-person"><input type="checkbox" data-custom="'+i+'"><span>'+escapeHTML(n)+'</span></label>').join('')+'</div>':'<p class="hint">You can paste names above. To select existing colleagues, first set up Entire Store Team.</p>')+
      '<p class="hint" id="customCount">0 colleagues selected</p>'+
      '<button type="button" class="btn primary" id="customDone">Add colleagues to training</button><button type="button" class="btn secondary" id="customBack">Back</button>');
    bindIconPicker('customSaveIconPicker','customSaveIconId');
    bindOptionalButtonText('toggleCustomSaveText','customSaveTextWrap','customSaveButtonText');
    const count=()=>{const picked=$('customPick')?.querySelectorAll('input:checked').length||0;const typed=parseLines($('customPaste').value).entries.length;$('customCount').textContent=picked+' selected from team · '+typed+' typed'};
    if($('customPick'))$('customPick').onchange=count;
    $('customPaste').oninput=count;
    $('saveCustomList').onchange=()=>{$('saveCustomExtras').hidden=!$('saveCustomList').checked};
    $('customDone').onclick=()=>{
      const picked=[...($('customPick')?.querySelectorAll('input:checked')||[])].map(el=>names[Number(el.dataset.custom)]);
      const typed=parseLines($('customPaste').value).entries;
      const entries=[];const seen=new Set();
      for(const row of [...picked.map(name=>({name,done:false,note:''})),...typed]){const key=row.name.toLocaleLowerCase();if(!seen.has(key)){entries.push(row);seen.add(key)}}
      if(!entries.length){showToast('Select or type at least one colleague');return}
      if($('saveCustomList').checked){
        const label=$('customListTitle').value.trim();
        if(!label){showToast('Enter a name for the custom list');$('customListTitle').focus();return}
        const duplicate=(state.customLists||[]).find(c=>c.name.toLocaleLowerCase()===label.toLocaleLowerCase());
        if(duplicate){showToast('List already exists: '+duplicate.name);return}
        const today=new Date(),created=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
        state.customLists=state.customLists||[];
        state.customLists.push({id:makeId(),name:label,created,names:entries.map(e=>e.name),iconId:$('customSaveIconId').value.trim(),buttonText:$('customSaveButtonText').value.trim()});
        save();
      }
      if(hasCompletionIcons($('customPaste').value)){
        askUseCompletion(entries,addEntries,list=>addEntries(list.map(p=>({...p,done:false}))));
      }else addEntries(entries);
    };
    $('customBack').onclick=showPeopleModal;
  }
  function showPeopleModal(){if(!active())return;
    openModal(modalHeader('Add colleagues')+'<div class="field"><label for="defaultGroup">Add a default group (optional)</label><select id="defaultGroup"><option value="">Choose a group…</option><option value="store">Store team</option><option value="managers">Managers</option><option value="cat5">CAT 5</option><option value="bakery">Bakery Specialists</option><option value="freshness">Freshness Specialists</option><option value="nonfood">Non Food Specialists</option><option value="mentors">Training mentors</option><option value="custom">Custom list</option>'+ (state.customLists||[]).map(c=>'<option value="'+escapeHTML(c.id)+'">'+escapeHTML(customListDisplayLabel(c,true))+'</option>').join('')+'</select></div><h3>Saved custom profiles</h3>'+savedProfilesHTML()+'<button type="button" class="btn green" id="useGroup">Use default group →</button><button type="button" class="btn secondary" id="editDefaults">⚙ Set up / edit default lists</button><hr><form id="peopleForm"><div class="field"><label for="nameLines">Or add individual colleagues (one per line)</label><textarea id="nameLines"></textarea><p class="hint">Paste a WhatsApp list: ☑️ done, 🔴 not done. Training headings are ignored; dates like “Katie Sunday” become notes. Check the imported names afterwards.</p></div><p class="inline-warning" id="peopleError" hidden></p><button class="btn primary" type="submit">Add typed names</button></form>');
    $('editDefaults').onclick=showGroupEditor;
    $('modal').querySelectorAll('[data-saved-profile]').forEach(b=>b.onclick=()=>askRemoveSpecific(b.dataset.savedProfile));
    $('defaultGroup').onchange=()=>{$('useGroup').textContent=$('defaultGroup').value==='custom'?'Create custom list →':'Use selected list →'};
    $('useGroup').onclick=()=>{const key=$('defaultGroup').value;if(!key){showToast('Choose a list');return}if(key==='custom'){showCustomList();return}askRemoveSpecific(key)};
    $('peopleForm').onsubmit=e=>{e.preventDefault();const raw=$('nameLines').value,parsed=parseLines(raw);if(!parsed.entries.length&&!parsed.review.length){$('peopleError').hidden=false;$('peopleError').textContent='Enter at least one colleague name.';return}reviewImports(parsed,entries=>{if(!entries.length){showToast('No colleagues selected');return}if(hasCompletionIcons(raw)){askUseCompletion(entries,addEntries,addEntries)}else addEntries(entries)})};
  }
  function editPerson(id){const course=active(),p=course?.people.find(p=>p.id===id);if(!p)return;openModal(modalHeader('Edit colleague')+'<form id="personForm"><div class="field"><label for="personName">Name</label><input id="personName" required maxlength="120" value="'+escapeHTML(p.name)+'"></div><div class="field"><label for="personNote">Note (optional)</label><input id="personNote" maxlength="240" placeholder="e.g. Friday / on leave" value="'+escapeHTML(p.note)+'"><p class="hint">Notes are included when you publish.</p></div><button class="btn primary" type="submit">Save colleague</button></form><button type="button" class="btn danger" id="removePerson">Remove colleague</button>','personName');$('personForm').onsubmit=e=>{e.preventDefault();const name=$('personName').value.trim();if(!name)return;if(course.people.some(q=>q.id!==id&&q.name.toLocaleLowerCase()===name.toLocaleLowerCase())){showToast('That colleague is already on this list');return}p.name=name;p.note=$('personNote').value.trim();save();closeModal();render()};$('removePerson').onclick=()=>{if(!confirm('Remove '+p.name+' from this training?'))return;course.people=course.people.filter(x=>x.id!==p.id);save();closeModal();render();showToast('Colleague removed')}}
  function togglePerson(id){const t=active(),p=t?.people.find(x=>x.id===id);if(!p)return;const previous=p.done,previousAt=p.completedAt;p.done=!p.done;p.completedAt=p.done?new Date().toISOString():'';save();render();lastUndo={courseId:t.id,personId:p.id,oldDone:previous};showToast(p.done?p.name+' completed':p.name+' moved to outstanding','Undo',()=>{const c=state.trainings.find(x=>x.id===lastUndo?.courseId),who=c?.people.find(x=>x.id===lastUndo?.personId);if(who){who.done=lastUndo.oldDone;who.completedAt=previousAt;state.activeId=c.id;save();render();showToast('Change undone')}lastUndo=null})}
  function publishMessage(t){const completed=t.people.filter(p=>p.done).length;const outstanding=t.people.filter(p=>!p.done);let msg='*'+t.title.replace(/\*/g,'')+'*\n';if(t.due)msg+='Deadline: '+fmtDate(t.due)+'\n';msg+='\n'+completed+'/'+t.people.length+' completed\n'+outstanding.length+' outstanding\n\n';if(outstanding.length){msg+='*Still to complete*\n'+outstanding.map(p=>'🔴 '+p.name+(p.note?' — '+p.note:'')).join('\n')}else msg+=t.people.length?'✅ All colleagues completed!':'No colleagues added yet.';return msg}
  function showPublish(){const course=active();if(!course)return;const msg=publishMessage(course);openModal(modalHeader('Publish training update')+'<p class="hint" style="margin-bottom:12px">Only outstanding colleagues are listed. Completed totals are still shown.</p><div class="preview" id="messagePreview"></div><button type="button" class="btn green" id="waSend">↗ Publish to WhatsApp</button><div class="modal-two"><button type="button" class="btn secondary" id="copyMsg">Copy message</button><button type="button" class="btn secondary" id="shareMsg">Share…</button></div>');$('messagePreview').textContent=msg;$('waSend').onclick=()=>{const url='https://wa.me/?text='+encodeURIComponent(msg);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';document.body.appendChild(link);link.click();link.remove()};$('copyMsg').onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(msg)}else{const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}showToast('Message copied')}catch(e){showToast('Copy failed — select the preview text')}};$('shareMsg').onclick=async()=>{if(navigator.share){try{await navigator.share({text:msg})}catch(e){if(e.name!=='AbortError')showToast('Share failed — try WhatsApp')}}else{showToast('Use WhatsApp or Copy message')}};}
  function showArchives(){
    openModal(modalHeader('Training archive')+'<p class="hint">Archive completed courses rather than deleting them. Restoring a course keeps its records.</p>'+state.trainings.map(t=>'<div class="overview-entry"><strong>'+escapeHTML(t.title)+'</strong><p class="hint">'+t.people.filter(p=>p.done).length+'/'+t.people.length+' completed · '+(t.archived?'Archived':'Current')+'</p><button class="btn secondary" data-archive="'+escapeHTML(t.id)+'">'+(t.archived?'Restore course':'Archive course')+'</button></div>').join(''));
    $('modal').querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const t=state.trainings.find(x=>x.id===b.dataset.archive);if(!t)return;if(!t.archived&&t.people.some(p=>!p.done)&&!confirm('Some colleagues are not complete. Archive anyway?'))return;t.archived=!t.archived;save();render();showArchives()});
  }
  function namesAcrossCourses(){const map=new Map();for(const t of currentCourses())for(const p of t.people){const k=profileKey(p.name);if(!map.has(k))map.set(k,{name:p.name,items:[]});map.get(k).items.push({course:t,person:p})}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
  function showColleagueOverview(){const names=namesAcrossCourses();openModal(modalHeader('Colleague overview')+'<div class="field"><input id="colleagueFilter" placeholder="Find a colleague" type="search"></div><div id="colleagueRows">'+names.map((row,i)=>'<button type="button" class="btn secondary" data-colleague="'+i+'" style="margin-bottom:8px;justify-content:space-between">'+escapeHTML(row.name)+' <span>'+row.items.filter(x=>!x.person.done).length+' outstanding →</span></button>').join('')+'</div><button type="button" class="btn green" id="sevenDayReport">Publish due-soon colleague report</button><p class="hint">Only training due within seven days or overdue is included in the report.</p>');
    const rows=[...$('colleagueRows').querySelectorAll('[data-colleague]')];rows.forEach(b=>b.onclick=()=>{const r=names[Number(b.dataset.colleague)];openModal(modalHeader(r.name)+r.items.map(x=>'<div class="overview-entry"><strong>'+escapeHTML(x.course.title)+'</strong><p>'+(x.person.done?'✓ Completed'+(x.person.completedAt?' '+escapeHTML(new Date(x.person.completedAt).toLocaleDateString('en-GB')):''):'🔴 Outstanding')+'</p></div>').join('')+'<button class="btn secondary" id="colleagueBack">Back</button>');$('colleagueBack').onclick=showColleagueOverview});
    $('colleagueFilter').oninput=()=>{const q=$('colleagueFilter').value.toLocaleLowerCase();rows.forEach((b,i)=>b.hidden=!names[i].name.toLocaleLowerCase().includes(q))};$('sevenDayReport').onclick=showSevenDayReport;
  }
  function showSevenDayReport(){const relevant=currentCourses().filter(t=>{const d=daysUntil(t.due);return d!==null&&d<=7});const map=new Map();for(const t of relevant)for(const p of t.people.filter(x=>!x.done)){const k=profileKey(p.name);if(!map.has(k))map.set(k,{name:p.name,courses:[]});map.get(k).courses.push(t.title)}let msg='*Training due within 7 days*\n\n';msg+=map.size?[...map.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'*'+p.name.replace(/\*/g,'')+'*\n'+p.courses.map(c=>'🔴 '+c).join('\n')).join('\n\n'):'No colleagues have outstanding training due within seven days.';openModal(modalHeader('Publish due-soon training')+'<div class="preview" id="dueSoonPreview"></div><button class="btn green" id="dueSoonWhatsApp">↗ Publish to WhatsApp</button><button class="btn secondary" id="dueSoonCopy">Copy report</button>');$('dueSoonPreview').textContent=msg;$('dueSoonWhatsApp').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');$('dueSoonCopy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);showToast('Report copied')}catch(e){showToast('Could not copy; select preview text')}}}
  function showStaffManager(){const all=cleanNames([...state.groups.store,...namesAcrossCourses().map(x=>x.name)]).filter(x=>!state.formerColleagues.includes(x));openModal(modalHeader('Store colleagues')+'<p class="hint">Add starters to the entire store team, or mark leavers. Historic completed training is kept.</p><div class="field"><label for="newStaff">New colleague</label><input id="newStaff" placeholder="Full name"></div><button class="btn primary" id="addStaff">Add starter</button>'+all.map((n,i)=>'<div class="overview-entry"><strong>'+escapeHTML(n)+'</strong><button type="button" class="btn secondary" data-leaver="'+i+'">Mark as left store</button></div>').join(''));$('addStaff').onclick=()=>{const n=$('newStaff').value.trim();if(!n)return;if(state.groups.store.some(x=>profileKey(x)===profileKey(n))){showToast('Already in store team');return}state.groups.store.push(n);save();const offered=currentCourses().filter(t=>!t.people.some(p=>profileKey(p.name)===profileKey(n)));if(offered.length&&confirm('Add '+n+' to all '+offered.length+' current training courses?'))for(const t of offered)t.people.push({id:makeId(),name:n,done:false,note:'',absence:null});save();render();showStaffManager()};$('modal').querySelectorAll('[data-leaver]').forEach(b=>b.onclick=()=>{const n=all[Number(b.dataset.leaver)];if(!confirm('Mark '+n+' as having left? Historical records will remain.'))return;state.formerColleagues.push(n);state.groups.store=state.groups.store.filter(x=>profileKey(x)!==profileKey(n));for(const key of Object.keys(state.groups))state.groups[key]=state.groups[key].filter(x=>profileKey(x)!==profileKey(n));save();showStaffManager()})}
  function updateSearch(){const box=$('pendingResults');if(!box)return;const q=($('nameSearch')?.value||'').toLocaleLowerCase(),only=$('availableOnly')?.dataset.available==='true';box.querySelectorAll('[data-person-row]').forEach(row=>{const person=active()?.people.find(p=>p.id===row.dataset.personRow);row.hidden=!!person&&(!person.name.toLocaleLowerCase().includes(q)||(only&&!!getAbsence(person)))});}
  function showData(){openModal(modalHeader('Backup and restore')+'<p class="modal-inset">This test app saves data only in the browser on this device. If browser data is cleared or you open a different device, your records will not appear there. Download a backup before switching devices.</p><button type="button" class="btn secondary" id="exportData">↓ Download backup (JSON)</button><button type="button" class="btn ghost" id="importData">↑ Restore from backup</button>');$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='training-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importData').onclick=()=>$('restoreInput').click()}
  function loadExample(){if(state.trainings.some(t=>t.title==='Modern slavery (example)')){showToast('Example already loaded');return}const lines=`April ☑️
Anthony ☑️
Raja ☑️
Nadim ☑️
Frol ☑️
Sohail ☑️
Katie ☑️
Teli 🔴
Eman ☑️
Eric ☑️
Mark ☑️
Evelyn ☑️
Rahmah ☑️
Tizita ☑️
Marina ☑️
Amanda ☑️
Sandra ☑️
Daniyal ☑️
Jurate ☑️
Katerina ☑️
Numan ☑️
Tolga ☑️
Nicholas 🔴 *friday*
Waheed ☑️
Eugena ☑️
Ryan ☑️
Evelina ☑️
Lhoussaine ☑️
Ashley ☑️
Prince ☑️
Amar ☑️`;const {entries}=parseLines(lines);const t={id:makeId(),title:'Modern slavery (example)',due:'',people:entries.map(e=>({...e,id:makeId()}))};state.trainings.push(t);state.activeId=t.id;completedExpanded=false;save();render();showToast('Example loaded — 2 still outstanding')}
  // Event delegation keeps controls working after every screen refresh.
  $('mainContent').addEventListener('click',e=>{const row=e.target.closest('[data-person-row]');if(!row||e.target.closest('button'))return;const now=Date.now(),id=row.dataset.personRow;if(id===tapPersonId&&now-tapAt<650)tapCount++;else tapCount=1;tapPersonId=id;tapAt=now;if(tapCount>=3){tapCount=0;showAbsenceChoice(id)}});
  $('mainContent').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.toggle){togglePerson(button.dataset.toggle);return}if(button.dataset.edit){editPerson(button.dataset.edit);return}switch(button.id){case 'startCourse':showCourseModal();break;case 'loadExample':loadExample();break;case 'addPeople':showPeopleModal();break;case 'publish':showPublish();break;case 'toggleCompleted':completedExpanded=!completedExpanded;render();break;case 'openData':showData();break;case 'manageGroups':showGroupEditor();break;case 'colleagueOverview':showColleagueOverview();break;case 'staffManage':showStaffManager();break;case 'availableOnly':button.dataset.available=button.dataset.available==='true'?'false':'true';button.textContent='Show available only: '+(button.dataset.available==='true'?'On':'Off');updateSearch();break;}});
  $('emptyTrainingChoice').onclick=()=>{openModal(modalHeader('No current training added')+'<p style="font-size:17px;margin:8px 0 20px">Add one?</p><button type="button" class="btn primary" id="confirmAddCourse">Add training</button><button type="button" class="btn secondary" data-close>Cancel</button>');$('confirmAddCourse').onclick=()=>{closeModal();showCourseModal()}};
  $('mainContent').addEventListener('input',e=>{if(e.target.id==='nameSearch')updateSearch()});
  $('overviewButton').onclick=showOverview;
  $('newCourse').onclick=()=>showCourseModal();$('editCourse').onclick=()=>showCourseModal(true);$('courseSelect').onchange=e=>{state.activeId=e.target.value;completedExpanded=false;save();render()};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')||e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});$('toastAction').onclick=()=>{const a=$('toastAction')._action;if(a)a()};
  $('restoreInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>3_000_000)throw Error('Backup is too large');const data=JSON.parse(await file.text()),restored=normalise(data);if(!restored)throw Error('Invalid backup');if(!confirm('Restore '+restored.trainings.length+' training courses? This replaces all current training on this device.'))return;state=restored;completedExpanded=false;save();closeModal();render();showToast('Backup restored')}catch(err){showToast('Could not restore: '+(err.message||'invalid file'))}});
  function showToast(msg,actionText,action){clearTimeout(toastTimer);$('toastText').textContent=msg;$('toast').hidden=false;const b=$('toastAction');b.hidden=!actionText;b.textContent=actionText||'';b._action=action||null;toastTimer=setTimeout(()=>{$('toast').hidden=true;b._action=null},actionText?8500:3400)}
  render();
})();
</script>
