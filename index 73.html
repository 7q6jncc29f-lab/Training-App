<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003c94">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TEAM Academy">
  <title>TEAM Training Academy • Training Tracker</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
<style>
  :root{color-scheme:light;--ink:#172f38;--muted:#60747c;--bg:#f2f5f4;--line:#e2e9e7;--brand:#bafa74;--green:#267247;--red:#ba433e;--radius:19px;--shadow:0 4px 22px rgba(18,46,55,.055)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #559bd0;outline-offset:2px}
  [hidden]{display:none!important}
  .shell{max-width:760px;margin:auto;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .mast{background:#142d39;color:white;padding:calc(27px + env(safe-area-inset-top)) 22px 26px;border-radius:0 0 26px 26px}
  .mast-inner{max-width:680px;margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px}
  .identity{display:flex;align-items:center;gap:10px;letter-spacing:.055em;font-size:13px;font-weight:800}.identity-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--brand);color:#142d39;font-size:22px}
  .test-version{font-size:11px;letter-spacing:.055em;background:#2a4652;padding:7px 10px;border-radius:100px;color:#e6f1f1;font-weight:750}
  .mast label{display:block;color:#b4c9cb;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .select-row{display:flex;gap:10px;align-items:stretch}.course-select{min-width:0;flex:1;width:100%;border:1px solid #567079;border-radius:13px;background:#233f4b;color:white;padding:14px 36px 14px 15px;font-size:17px;font-weight:750;min-height:53px}.course-select option{color:#172f38;background:white}
  .add-course{flex:none;border:1px solid #bafa74;background:#bafa74;color:#132d38;border-radius:13px;padding:0 17px;font-size:25px;font-weight:700;min-width:53px;min-height:53px}
  .mast-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}.mast-bottom span{font-size:13px;color:#b4c9cb}.mast-bottom button{border:0;background:none;color:#bafa74;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:4px}
  main{padding:20px 16px 0}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;padding:20px}
  .eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.085em;font-weight:850}.course-name{font-size:clamp(23px,5vw,30px);letter-spacing:-.035em;font-weight:850;line-height:1.16;margin:7px 0 16px;overflow-wrap:anywhere}
  .due{display:inline-flex;align-items:center;gap:7px;color:#42616a;background:#f0f5f4;font-size:13px;font-weight:700;border-radius:9px;padding:8px 11px}.due.overdue{color:#a83c36;background:#fff1ee}.due.today{color:#976216;background:#fff6e3}
  .progress-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-top:24px;margin-bottom:10px}.fraction{font-size:37px;font-weight:850;letter-spacing:-.06em;line-height:1}.fraction small{font-size:19px;color:#789098;font-weight:700}.progress-desc{text-align:right;color:var(--muted);font-size:13px;font-weight:700}
  .progress-outer{background:#edf1f1;height:11px;border-radius:20px;overflow:hidden}.progress-inner{height:100%;background:linear-gradient(90deg,#8dd65f,#3d9c64);width:0%;transition:width .2s ease}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.btn{border:1px solid transparent;border-radius:13px;padding:13px 15px;min-height:50px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
  .btn.primary{background:var(--ink);color:white}.btn.secondary{background:#eef3f1;border-color:#e1e8e6;color:var(--ink)}.btn.green{background:#bafa74;color:#173a2a}.btn.danger{background:#fff1ef;color:#a63a36;border-color:#ffd4d0}.btn.ghost{background:white;border-color:var(--line);color:var(--ink)}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{font-size:19px;letter-spacing:-.025em;margin:0}.count{font-size:13px;font-weight:800;color:#a54537;background:#fff0ed;border-radius:30px;padding:5px 11px;white-space:nowrap}.count.done{color:#276e43;background:#edf7ee}
  .subline{margin:-8px 0 13px;font-size:13px;color:var(--muted)}.person-list{display:flex;flex-direction:column;gap:9px}.person{display:flex;gap:12px;align-items:center;min-height:64px;border:1px solid var(--line);border-radius:13px;padding:9px 10px 9px 8px;background:#fff}.person.done-person{background:#f8faf8}
  .tick{width:42px;height:42px;border-radius:12px;border:2px solid #b8c9c9;background:white;display:grid;place-items:center;flex:none;color:transparent;font-size:24px;font-weight:850;line-height:1}.tick.done-tick{color:white;background:#378a5f;border-color:#378a5f}.person-details{flex:1;min-width:0}.person-name{font-size:16px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}.person-note{display:block;font-size:12px;color:#855b26;margin-top:3px;overflow-wrap:anywhere}.person-edit{border:0;background:#f0f4f4;color:#54717a;border-radius:9px;min-width:36px;height:36px;font-size:17px;font-weight:850}.person-edit:active{transform:scale(.96)}
  .empty-list{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed #cedbd8;border-radius:14px;background:#fafcfb}.empty-list strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.empty-list .celebrate{font-size:32px;margin-bottom:5px}
  .completed-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;text-align:left;font-size:16px;font-weight:800;color:var(--ink);padding:2px 0}.completed-content{margin-top:16px}.chevron{font-size:18px;color:#60747c}
  .footnote{font-size:12px;color:#70848a;line-height:1.5;margin:9px 3px 0;text-align:center}.footer-link{border:0;background:none;color:#47666f;text-decoration:underline;font-size:12px;padding:8px}
  .blank{padding:26px 12px;text-align:center}.blank-icon{font-size:42px;background:#f0f7e7;width:78px;height:78px;border-radius:20px;display:grid;place-items:center;margin:2px auto 22px}.blank h1{font-size:25px;line-height:1.2;letter-spacing:-.03em;margin:0 0 9px}.blank p{font-size:15px;color:var(--muted);max-width:380px;margin:0 auto 24px}.blank .btn{width:100%;margin-bottom:10px;max-width:330px}
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(8,28,34,.64);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.modal{max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;background:white;color:var(--ink);border-radius:22px;width:min(100%,550px);padding:21px 20px 22px;box-shadow:0 20px 80px rgba(0,0,0,.24)}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px}.modal h2{margin:0;font-size:23px;letter-spacing:-.035em}.close{display:grid;place-items:center;border:0;border-radius:10px;background:#eef3f3;width:35px;height:35px;color:var(--ink);font-size:24px;font-weight:500;line-height:1}
  .field{margin:0 0 15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid #cedbd8;background:#fcfdfd;color:var(--ink);font-size:16px;min-height:50px}.field textarea{min-height:190px;resize:vertical;line-height:1.6}.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}.modal .btn{width:100%;margin-top:9px}.modal .btn:first-of-type{margin-top:3px}.preview{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:13px;background:#f1f5f3;border:1px solid #e0eae6;padding:15px;font-size:14px;line-height:1.65;max-height:39dvh;overflow:auto}.modal-inset{background:#f5f8f7;border-radius:12px;padding:13px;font-size:13px;color:#5d7479;margin:8px 0 14px}.modal-two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-two .btn{margin-top:9px}.modal hr{border:0;border-top:1px solid var(--line);margin:20px 0}.file-input{display:none}.inline-warning{color:#a23b38;font-size:13px;font-weight:700;margin:7px 0}
  .pick-list{max-height:38dvh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}.pick-person{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);font-weight:700}.pick-person:last-child{border:0}.pick-person input{width:23px;height:23px;accent-color:#267247;flex:none}
  .toast{position:fixed;z-index:80;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#193740;color:#fff;min-height:54px;border-radius:14px;display:flex;align-items:center;gap:18px;justify-content:space-between;padding:12px 14px 12px 17px;box-shadow:0 7px 38px #142d3952;width:min(calc(100% - 24px),500px);font-size:14px}.toast button{border:0;background:#bafa74;color:#142d39;border-radius:9px;font-weight:800;padding:9px 12px;flex:none}
  @media(min-width:650px){.mast{padding:38px 22px 30px}.shell main{padding:24px 16px}.card{padding:26px}.overlay{align-items:center}.modal{padding:26px}.actions .btn{font-size:15px}}
  @media(prefers-reduced-motion:reduce){.progress-inner{transition:none}}

  /* TEAM Training Academy visual edition: retains existing training and local data. */
  :root{--ink:#133463;--muted:#5c6f86;--bg:#f0f4fa;--line:#d9e3f1;--brand:#ffdf32;--green:#17825a;--red:#c84642;--shadow:0 6px 24px rgba(5,46,106,.07)}
  .mast{background:linear-gradient(155deg,#00348a,#0754b7);border-bottom:5px solid #ffd521;border-radius:0 0 27px 27px;padding-top:calc(19px + env(safe-area-inset-top))}
  .academy-banner{display:flex;align-items:center;gap:13px;margin:0 0 20px;padding:13px 13px 14px;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(255,255,255,.1)}
  .academy-emblem{flex:none;width:64px;height:64px;background:#fff;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #ffdf32}
  .academy-emblem svg path:first-child{fill:#0d48a0}.academy-emblem svg path{stroke:#0d48a0}.academy-emblem svg circle{fill:#0d48a0}
  .academy-wordmark{min-width:0}.academy-team{font-size:clamp(36px,10vw,61px);line-height:.95;letter-spacing:-.07em;font-weight:1000;color:#fff}.academy-mark{font-size:.45em;display:inline-grid;place-items:center;vertical-align:middle;letter-spacing:0;background:#ffdf32;color:#08418f;border-radius:8px;width:34px;height:34px;margin-left:7px}
  .academy-subtitle{font-size:11px;letter-spacing:.23em;font-weight:800;color:#ffdf32;margin-top:9px;white-space:nowrap}
  .topline{margin-bottom:18px}.identity-mark{background:#ffdf32;color:#06408d}.test-version{background:rgba(255,255,255,.13);color:white}.mast label,.mast-bottom span{color:#d8e5fb}
  .empty-training-choice{text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.empty-training-choice[hidden]{display:none!important}
  .course-select{background:#fff;color:#143e85;border-color:#93b3e8}.course-select option{color:#143e85}.add-course{background:#ffdf32;border-color:#ffdf32;color:#0b3b80}.mast-bottom button{color:#ffdf32}
  .card{border-color:#dce6f3}.course-name{color:#003d98}.due{background:#eaf2ff;color:#26589c}.progress-inner{background:linear-gradient(90deg,#ffdc37,#eca900)}
  .btn.primary{background:#063f97;color:#fff}.btn.secondary{background:#edf3ff;border-color:#d6e5fd;color:#17427e}.btn.green{background:#ffdb28;color:#13366c}.btn.ghost{color:#164079}
  .tick.done-tick{background:#0b65bd;border-color:#0b65bd}.count.done{background:#e5f3ff;color:#0b5aaf}.blank-icon{background:#e9f2ff}.pick-person input{accent-color:#0b59b4}
  .toast{background:#063d89}.toast button{background:#ffdf32;color:#123668}.preview{background:#f2f6fc;border-color:#d9e5f6}
  @media(max-width:360px){.academy-team{font-size:36px}.academy-subtitle{letter-spacing:.15em}.academy-emblem{width:54px;height:54px}.academy-banner{gap:10px}}
.academy-banner{justify-content:center}.academy-emblem{margin:auto}
</style>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="mast-inner">
      <div class="academy-banner" aria-label="Training Academy logo"><div class="academy-emblem" aria-hidden="true"><svg viewBox="0 0 96 72" width="66" height="50"><path fill="#f9cc16" d="M2 23 48 5l46 18-46 18z"/><path stroke="#f9cc16" stroke-width="5" fill="none" d="M17 30v19q31 23 61 0V30"/><path stroke="#f9cc16" stroke-width="4" d="M7 25v26"/><circle cx="7" cy="56" r="5" fill="#f9cc16"/></svg></div></div><div class="topline"><div class="identity"><span class="identity-mark" aria-hidden="true">✓</span><span>TRAINING TRACKER</span></div><span class="test-version">V2.2</span></div>
      <label for="courseSelect">Current training</label>
      <div class="select-row"><button type="button" id="emptyTrainingChoice" class="course-select empty-training-choice" hidden>No training added <span aria-hidden="true">⌄</span></button><select id="courseSelect" class="course-select" aria-label="Select training"></select><button id="newCourse" class="add-course" type="button" aria-label="Add training course" title="Add training">+</button></div>
      <div class="mast-bottom"><span id="headerMessage">Stay on top of colleague training.</span><button type="button" id="editCourse">Edit training</button></div>
    </div>
  </header>
  <main id="mainContent" aria-live="polite"></main>
</div>
<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div id="toast" class="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>
<input type="file" id="restoreInput" class="file-input" accept=".json,application/json">
<script>
(function(){'use strict';
  const KEY='training-tracker-v1';
  const $=id=>document.getElementById(id);
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const makeId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
  let state={trainings:[],activeId:null,groups:{store:[],managers:[]},customLists:[]},lastUndo=null,completedExpanded=false,toastTimer=null,previousFocus=null;
  function isValidDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00'))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s}
  function cleanNames(raw){const seen=new Set();return (Array.isArray(raw)?raw:[]).filter(x=>typeof x==='string').map(x=>x.trim().slice(0,120)).filter(x=>{const k=x.toLocaleLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,500)}
  function normalise(raw){if(!raw||!Array.isArray(raw.trainings))return null;const trainings=[];const ids=new Set();for(const t of raw.trainings.slice(0,1000)){if(!t||typeof t.title!=='string'||!t.title.trim())continue;let id=typeof t.id==='string'&&t.id.length<120?t.id:makeId();if(ids.has(id))id=makeId();ids.add(id);const seen=new Set();const people=[];for(const p of Array.isArray(t.people)?t.people.slice(0,5000):[]){if(!p||typeof p.name!=='string'||!p.name.trim())continue;const key=p.name.trim().toLocaleLowerCase();if(seen.has(key))continue;seen.add(key);people.push({id:typeof p.id==='string'&&p.id.length<120?p.id:makeId(),name:p.name.trim().slice(0,120),done:p.done===true,note:typeof p.note==='string'?p.note.slice(0,240):''});}trainings.push({id,title:t.title.trim().slice(0,150),due:isValidDate(t.due)?t.due:'',people});}return{trainings,activeId:trainings.some(t=>t.id===raw.activeId)?raw.activeId:(trainings[0]?.id||null),groups:{store:cleanNames(raw.groups?.store),managers:cleanNames(raw.groups?.managers)},customLists:(Array.isArray(raw.customLists)?raw.customLists:[]).filter(c=>c&&typeof c.name==='string'&&c.name.trim()).slice(0,100).map(c=>({id:typeof c.id==='string'?c.id:makeId(),name:c.name.trim().slice(0,120),created:isValidDate(c.created)?c.created:new Date().toISOString().slice(0,10),names:cleanNames(c.names)}))}}
  try{const raw=localStorage.getItem(KEY);if(raw)state=normalise(JSON.parse(raw))||state}catch(e){console.warn('Could not read saved training',e)}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){showToast('Unable to save. Check browser storage.');return false}}
  function active(){return state.trainings.find(t=>t.id===state.activeId)||null}
  function fmtDate(iso){if(!isValidDate(iso))return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
  function dueStatus(iso){if(!iso)return'';const d=new Date();const today=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return iso<today?'overdue':iso===today?'today':''}
  function shortDue(iso){const st=dueStatus(iso);return st==='overdue'?'Overdue · '+fmtDate(iso):st==='today'?'Due today · '+fmtDate(iso):'Deadline · '+fmtDate(iso)}
  function render(){const selected=active();const selector=$('courseSelect');selector.innerHTML=state.trainings.length?state.trainings.map(t=>'<option value="'+escapeHTML(t.id)+'" '+(t.id===state.activeId?'selected':'')+'>'+escapeHTML(t.title)+'</option>').join(''):'<option value="">No training added</option>';selector.hidden=!state.trainings.length;$('emptyTrainingChoice').hidden=!!state.trainings.length;selector.disabled=!state.trainings.length;$('editCourse').hidden=!selected;$('headerMessage').textContent=selected?state.trainings.length+' training '+(state.trainings.length===1?'course':'courses')+' saved on this device.':'Stay on top of colleague training.';
    const main=$('mainContent');if(!selected){main.innerHTML='<section class="card blank"><div class="blank-icon" aria-hidden="true">📋</div><h1>Start your training list</h1><p>Add a training course, set a deadline, then paste your colleague names. Tick someone off and they disappear from the outstanding list.</p><button class="btn primary" id="startCourse" type="button">+ Create training</button><button class="btn secondary" id="manageGroups" type="button">⚙ Manage default colleague lists</button></section><p class="footnote">Training is saved to this browser, not to a shared online database.</p>';return}
    const done=selected.people.filter(p=>p.done),pending=selected.people.filter(p=>!p.done),total=selected.people.length,pct=total?Math.round(done.length/total*100):0;
    const pendingList=pending.length?'<div class="person-list">'+pending.map(p=>personHTML(p,false)).join('')+'</div>':'<div class="empty-list"><div class="celebrate">'+(total?'🎉':'👥')+'</div><strong>'+(total?'Everyone is complete!':'No colleagues added yet')+'</strong>'+(total?'All names are ticked off.':'Use “Add colleagues” to create your list.')+'</div>';
    main.innerHTML='<section class="card"><div class="eyebrow">Training course</div><h1 class="course-name">'+escapeHTML(selected.title)+'</h1><div class="due '+dueStatus(selected.due)+'">'+(selected.due?('◷ '+escapeHTML(shortDue(selected.due))):'◷ No deadline set')+'</div><div class="progress-head"><div class="fraction">'+done.length+'<small> / '+total+'</small></div><div class="progress-desc">COMPLETED<br>'+pending.length+' outstanding</div></div><div class="progress-outer" role="progressbar" aria-label="Training completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="progress-inner" style="width:'+pct+'%"></div></div><div class="actions"><button type="button" class="btn secondary" id="addPeople">＋ Add colleagues</button><button type="button" class="btn green" id="publish" >↗ Publish</button></div></section>'+ 
      '<section class="card"><div class="section-head"><h2>Still to complete</h2><span class="count">'+pending.length+' remaining</span></div><p class="subline">Tap the square beside a name when their training is finished.</p>'+pendingList+'</section>'+ 
      (done.length?'<section class="card"><button type="button" class="completed-toggle" id="toggleCompleted" aria-expanded="'+completedExpanded+'"><span>✓ Completed colleagues <span class="count done">'+done.length+'</span></span><span class="chevron">'+(completedExpanded?'⌃':'⌄')+'</span></button>'+(completedExpanded?'<div class="completed-content person-list">'+done.map(p=>personHTML(p,true)).join('')+'</div>':'')+'</section>':'')+ 
      '<div style="text-align:center"><button type="button" class="btn secondary" id="manageGroups">⚙ Manage default colleague lists</button></div><p class="footnote">Your progress saves automatically on this device. <button class="footer-link" id="openData" type="button">Backup / restore</button></p>';
  }
  function personHTML(p,done){return '<div class="person '+(done?'done-person':'')+'"><button type="button" class="tick '+(done?'done-tick':'')+'" data-toggle="'+escapeHTML(p.id)+'" aria-label="'+(done?'Mark '+escapeHTML(p.name)+' not completed':'Complete training for '+escapeHTML(p.name))+'" title="'+(done?'Move back to outstanding':'Mark completed')+'">'+(done?'✓':'')+'</button><div class="person-details"><div class="person-name">'+escapeHTML(p.name)+'</div>'+(p.note?'<span class="person-note">↳ '+escapeHTML(p.note)+'</span>':'')+'</div><button type="button" class="person-edit" data-edit="'+escapeHTML(p.id)+'" title="Edit name or note" aria-label="Edit '+escapeHTML(p.name)+'">✎</button></div>'}

  function parseLines(raw){
    const entries=[], ignored=[];
    const lines=String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const hasStatus=lines.some(s=>/[☑✅✔✓🔴❌]/u.test(s));
    const roster=new Set([...state.groups.store,...state.groups.managers,...(state.customLists||[]).flatMap(c=>c.names),...(active()?.people||[]).map(p=>p.name)].map(n=>n.toLocaleLowerCase()));
    const timing=/\b(?:today|tonight|tomorrow|yesterday|next\s+week|this\s+week|next\s+(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)|(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?))\b/i;
    const noteWords=/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?/i;
    for(let i=0;i<lines.length;i++){
      const original=lines[i];
      if(/^\d+\s*\/\s*\d+(?:\s+completed)?$/i.test(original)||/^(?:completed|outstanding|deadline|remaining|still to complete|training)\s*:/i.test(original)||/^(?:still to complete|completed colleagues)$/i.test(original)){ignored.push(original);continue}
      const icons=/[☑✅✔✓🔴❌]/u.test(original);
      let line=original.replace(/^[\s\-*•]+/,'').replace(/[☑✅✔✓🔴❌\uFE0E\uFE0F]/gu,'').replace(/^\*+(?=\S)/,'').trim();
      if(!line){ignored.push(original);continue}
      // Headings such as "LOS Video 6 Minutes:", "*Modern slavery*" and "Training: Food safety"
      // are not colleagues. Only use stronger title cues so unusual real names survive.
      if(!icons&&!roster.has(line.toLocaleLowerCase())&&(
        (i===0&&hasStatus&&/^\*[^*]+\*$/.test(original))||
        /^(?:training|course|module|subject)\s*[:\-]/i.test(line)||
        /^(?:los|health\s*(?:and|&)\s*safety|food\s+safety|modern\s+slavery)\b.*(?:video|minutes?|training|refresher|:)\s*:?\s*$/i.test(line)||
        /^(?:.+\b(?:video|training|refresher|induction)\b.{0,50}:)$/i.test(line)
      )){ignored.push(original);continue}
      const done=/[☑✅✔✓]/u.test(original)&&!/[🔴❌]/u.test(original);
      let note='';
      const starred=line.match(/\s+\*([^*]+)\*\s*$/);
      if(starred){note=starred[1].trim();line=line.slice(0,starred.index).trim()}
      else{
        const dash=line.match(/\s+[-–—]\s+(.+)$/);
        if(dash){note=dash[1].trim();line=line.slice(0,dash.index).trim()}
      }
      // "Katie Sunday", "Nicholas *Friday*", "April to do tomorrow" =>
      // keep the colleague name, store when they intend to do it as a note.
      if(!note){
        const parts=line.split(/\s+/);
        for(let cut=1;cut<parts.length;cut++){
          const candidate=parts.slice(cut).join(' ').replace(/^[,;:() ]+|[,;:() ]+$/g,'');
          if(timing.test(candidate)&&noteWords.test(candidate)&&/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?(?:(?:this|next)\s+)?(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?|today|tonight|tomorrow|yesterday|week)(?:\s+.*)?$/i.test(candidate)){
            const base=parts.slice(0,cut).join(' ');
            // avoid splitting a known full colleague name
            if(!roster.has(line.toLocaleLowerCase())&&(roster.has(base.toLocaleLowerCase())||cut===1||/^(?:to|on|by|for|due|next|this)\b/i.test(parts[cut]))){
              line=base;note=candidate;break;
            }
          }
        }
      }
      line=line.replace(/^\*+|\*+$/g,'').trim();
      if(!line||/^\d+\s*\/\s*\d+$/.test(line)){ignored.push(original);continue}
      entries.push({name:line.slice(0,120),done,note:note.slice(0,240)});
    }
    return {entries,skipped:ignored.length,ignored};
  }

  $('mainContent').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.toggle){togglePerson(button.dataset.toggle);return}if(button.dataset.edit){editPerson(button.dataset.edit);return}switch(button.id){case 'startCourse':showCourseModal();break;case 'loadExample':loadExample();break;case 'addPeople':showPeopleModal();break;case 'publish':showPublish();break;case 'toggleCompleted':completedExpanded=!completedExpanded;render();break;case 'openData':showData();break;case 'manageGroups':showGroupEditor();break;}});
  $('emptyTrainingChoice').onclick=()=>{openModal(modalHeader('No current training added')+'<p style="font-size:17px;margin:8px 0 20px">Add one?</p><button type="button" class="btn primary" id="confirmAddCourse">Add training</button><button type="button" class="btn secondary" data-close>Cancel</button>');$('confirmAddCourse').onclick=()=>{closeModal();showCourseModal()}};
  $('newCourse').onclick=()=>showCourseModal();$('editCourse').onclick=()=>showCourseModal(true);$('courseSelect').onchange=e=>{state.activeId=e.target.value;completedExpanded=false;save();render()};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')||e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});$('toastAction').onclick=()=>{const a=$('toastAction')._action;if(a)a()};
  $('restoreInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>3_000_000)throw Error('Backup is too large');const data=JSON.parse(await file.text()),restored=normalise(data);if(!restored)throw Error('Invalid backup');if(!confirm('Restore '+restored.trainings.length+' training courses? This replaces all current training on this device.'))return;state=restored;completedExpanded=false;save();closeModal();render();showToast('Backup restored')}catch(err){showToast('Could not restore: '+(err.message||'invalid file'))}});
  function showToast(msg,actionText,action){clearTimeout(toastTimer);$('toastText').textContent=msg;$('toast').hidden=false;const b=$('toastAction');b.hidden=!actionText;b.textContent=actionText||'';b._action=action||null;toastTimer=setTimeout(()=>{$('toast').hidden=true;b._action=null},actionText?8500:3400)}
  render();
})();
</script>
</body>
