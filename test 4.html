<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Store Training">
  <title>TEST · Store Training Tracker</title>
  <link rel="icon" type="image/png" href="icon.png?v=24">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png?v=24">
  <link rel="manifest" href="manifest.webmanifest?v=23">
<style>
/* TRAINING TRACKER · V3.6 VISUAL TEST
   One unified stylesheet. All training logic remains unchanged.
   Design: sharply defined navy typography, crisp white surfaces, minimal Lidl yellow accents. */
:root {
  color-scheme:light;
  --ink:#122945; --muted:#64738b; --blue:#0753ad; --blue-dark:#073f88;
  --yellow:#ffdb31; --bg:#f4f6fa; --line:#dce4ee;
  --soft:#eff4fb; --green:#087c65; --red:#bf3642;
  --radius:14px; --shadow:0 3px 12px rgba(16,39,76,.035);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.008em}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.46;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #79aef1;outline-offset:2px}
[hidden]{display:none!important}
.shell{max-width:650px;margin:auto;padding-bottom:calc(38px + env(safe-area-inset-bottom))}
/* Header */
.mast{background:#fff;color:var(--ink);border-top:5px solid var(--blue);border-bottom:1px solid var(--line);border-radius:0 0 17px 17px;padding:calc(17px + env(safe-area-inset-top)) 20px 20px;box-shadow:0 3px 10px rgba(28,62,111,.032)}
.mast-inner{max-width:620px;margin:auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:0 0 18px}
.identity{display:flex;align-items:center;gap:11px;min-width:0;color:var(--ink);font-weight:900;font-size:12px;line-height:1.3;letter-spacing:.065em}
.identity>span{max-width:220px}
.identity-mark{display:none}
.site-photo{display:flex;flex:none;align-items:center;justify-content:center;margin:0}
.site-photo img{display:block;width:46px;height:46px;object-fit:cover;border-radius:11px;border:1px solid #d6e2ef;box-shadow:none}
.test-version{flex:none;font-size:10px;letter-spacing:.06em;color:#4167a1;border:1px solid #cbdcf3;background:#f1f6fd;padding:6px 9px;border-radius:7px;font-weight:900;white-space:nowrap}
.overview-launch{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eff5ff;color:#104e9d;border:1px solid #d8e7fb;border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px;font-weight:850;text-align:left}
.overview-launch span{font-size:18px;font-weight:700}
.overview-launch:active{background:#dfeeff}
.mast label{display:block;color:#62738b;font-size:10px;font-weight:850;letter-spacing:.115em;text-transform:uppercase;margin:0 0 8px}
.select-row{display:flex;gap:9px;align-items:stretch}
.course-select{min-width:0;width:100%;flex:1;min-height:51px;border:1px solid #cdd9e9;background:#fff;color:#142d52;border-radius:10px;padding:12px 35px 12px 13px;font-size:16px;font-weight:800}
.course-select option{background:#fff;color:var(--ink)}
.empty-training-choice{text-align:left;display:flex;align-items:center;justify-content:space-between}
.empty-training-choice[hidden]{display:none!important}
.add-course{flex:none;min-width:51px;min-height:51px;border-radius:10px;border:1px solid #f6ce15;background:var(--yellow);color:#112b54;display:grid;place-items:center;padding:0;font-size:28px;font-weight:600}
.mast-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:13px}
.mast-bottom span{color:#728198;font-size:11px}
.mast-bottom button{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:5px 0}
/* Cards and course overview */
main{padding:16px 14px 0}
.card{margin:0 0 12px;padding:19px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:.105em;text-transform:uppercase;color:#728199}
.course-name{font-size:clamp(23px,5.5vw,29px);line-height:1.15;font-weight:900;letter-spacing:-.035em;color:var(--ink);margin:5px 0 15px;overflow-wrap:anywhere}
.due{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;background:#edf4ff;border:1px solid #ddeafb;color:#23599b;border-radius:8px;font-weight:800;font-size:12px}
.due.today{background:#fff8e2;border-color:#f8e7aa;color:#8f6400}
.due.overdue{background:#fff0f1;border-color:#f5d7db;color:#b83342}
.progress-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:21px 0 12px}
.fraction{font-size:39px;line-height:.99;letter-spacing:-.06em;font-weight:900;font-variant-numeric:tabular-nums;color:#113d7d}
.fraction small{font-size:18px;color:#8290a2;font-weight:750}
.progress-desc{font-size:11px;text-align:right;color:#65758c;letter-spacing:.01em;font-weight:750;line-height:1.5}
.progress-outer{height:9px;background:#ecf0f5;border-radius:99px;overflow:hidden}
.progress-inner{height:100%;width:0;background:var(--yellow);border-radius:99px;transition:width .18s ease}
/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:11px 13px;text-align:center;text-decoration:none;font-weight:850;font-size:13px;line-height:1.25;border:1px solid transparent;border-radius:10px;box-shadow:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.secondary{background:#f0f5fc;color:#154a8d;border-color:#dce7f6}
.btn.green{background:var(--yellow);color:#122c58;border-color:#f6d12a}
.btn.danger{background:#fff0f1;border-color:#f5d4d7;color:#a52c36}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn:active,.add-course:active{filter:brightness(.97)}
/* Colleague list */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:0 0 13px}
.section-head h2{font-size:18px;font-weight:900;line-height:1.2;margin:0;letter-spacing:-.027em}
.count{border-radius:7px;white-space:nowrap;padding:5px 8px;font-size:11px;font-weight:900;background:#fff0f2;color:#ad3a48}
.count.done{background:#eaf5f1;color:#097158}
.subline{font-size:12px;color:#6e7d92;margin:-5px 0 14px;line-height:1.45}
.person-list{display:flex;flex-direction:column;gap:7px}
.person{display:flex;align-items:center;gap:12px;padding:8px 9px;min-height:58px;background:#fff;border:1px solid #e1e7ef;border-radius:10px}
.person.done-person{background:#f8faff}
.tick{display:grid;place-items:center;flex:none;width:39px;height:39px;border-radius:9px;border:1.5px solid #afbed1;color:transparent;background:#fff;font-size:24px;font-weight:900;line-height:1}
.tick.done-tick{background:var(--blue);border-color:var(--blue);color:white}
.person-details{flex:1;min-width:0}.person-name{font-size:14px;line-height:1.32;font-weight:850;overflow-wrap:anywhere;color:#1a304c}
.person-note{display:block;color:#94672a;font-size:11px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
.person-edit{flex:none;min-width:36px;height:36px;background:#f2f5f9;border:1px solid #edf0f5;border-radius:8px;color:#526e92;font-size:17px;font-weight:800}
#nameSearch{height:45px;min-height:45px!important;background:#fdfefe!important}
#availableOnly{min-height:37px;font-size:11px;padding:8px 11px;margin:0 0 13px}
.empty-list{text-align:center;padding:30px 12px;background:#fafcff;border:1px dashed #d2ddeb;border-radius:11px;color:var(--muted);font-size:13px}
.empty-list strong{display:block;font-size:16px;margin:0 0 5px;color:var(--ink)}
.empty-list .celebrate{font-size:31px;margin-bottom:6px}
.completed-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;background:transparent;color:var(--ink);border:0;font-size:15px;font-weight:850;padding:0}
.completed-content{margin-top:16px}.chevron{color:#69809d;font-size:17px}
.footnote{color:#8592a4;font-size:11px;line-height:1.5;text-align:center;margin:12px 3px 0}
.footer-link{color:var(--blue);background:transparent;border:0;text-decoration:underline;text-underline-offset:2px;padding:5px;font-size:11px}
.blank{padding:29px 18px;text-align:center}.blank-icon{display:grid;place-items:center;margin:2px auto 17px;width:70px;height:70px;border-radius:15px;background:#eff5ff;font-size:35px}
.blank h1{margin:0 0 10px;font-size:24px;font-weight:900;letter-spacing:-.025em;line-height:1.2}
.blank p{max-width:360px;margin:0 auto 20px;color:var(--muted);font-size:14px}.blank .btn{max-width:340px;width:100%;margin-bottom:9px}
main>div[style*="text-align:center"]{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px auto 10px}
main>div[style*="text-align:center"]>.btn{min-height:40px;padding:10px 12px;font-size:12px}
/* Dialogues, inputs, and selection */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(16,29,51,.53);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.modal{width:min(100%,550px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;background:#fff;color:var(--ink);border:1px solid #e3eaf4;border-radius:16px;padding:20px;box-shadow:0 18px 65px rgba(13,37,77,.22)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin:0 0 17px}
.modal h2{font-size:22px;font-weight:900;letter-spacing:-.025em;line-height:1.2;margin:0}
.close{display:grid;place-items:center;flex:none;width:36px;height:36px;background:#eff3f8;color:#496078;border:1px solid #e4e9ef;border-radius:9px;font-size:22px;font-weight:500;line-height:1}
.field{margin:0 0 15px}.field label{display:block;font-size:12px;color:#324f73;font-weight:850;margin:0 0 7px}
.field input,.field textarea,.field select{display:block;width:100%;padding:12px 13px;min-height:47px;border:1px solid #ced9e7;border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
.field textarea{min-height:170px;resize:vertical;line-height:1.55}.field input::placeholder,.field textarea::placeholder{color:#97a3b4}
.hint{font-size:12px;line-height:1.5;color:#718097;margin:6px 0 0}
.modal .btn{width:100%;margin-top:9px}.modal .btn:first-of-type{margin-top:4px}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;font-size:13px;line-height:1.6;max-height:38dvh;overflow:auto;background:#f7f9fd;border:1px solid #dfe6ef;border-radius:10px}
.modal-inset{background:#f4f7fb;border-radius:10px;padding:13px;font-size:13px;color:#637991;margin:8px 0 14px}
.modal-two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-two .btn{margin-top:9px}
.modal hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.file-input{display:none}.inline-warning{color:#a32f3f;font-weight:750;font-size:12px;margin:7px 0}
.pick-list{max-height:39dvh;overflow:auto;border:1px solid #e1e8f1;border-radius:10px;margin:12px 0}
.pick-person{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #e6eaf2;font-weight:750;font-size:13px}.pick-person:last-child{border:0}
.pick-person input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(calc(100% - 24px),500px);min-height:52px;background:#15345b;color:#fff;border-radius:11px;padding:12px 15px;font-size:13px;box-shadow:0 8px 28px rgba(8,33,72,.24)}
.toast button{flex:none;border:0;border-radius:8px;background:var(--yellow);color:#142f53;font-weight:900;padding:8px 10px}
/* Overview */
.overview-entry{border:1px solid #dfe7f1;background:#fff;border-radius:11px;margin:10px 0;padding:15px}
.overview-title{color:var(--ink);font-size:16px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.overview-due{font-size:12px;color:#61738d;font-weight:700;margin:9px 0 7px}
.overview-days{color:#b93845;font-weight:900}
.overview-completed{font-size:12px;font-weight:850;color:#295991}
.overview-entry .overview-open{margin-top:12px;width:100%}
.overview-empty{padding:20px 5px;text-align:center;color:var(--muted)}
/* Colleague profile choices */
.profile-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0 17px}
.profile-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:117px;min-width:0;padding:13px 8px;text-align:center;background:#fff;color:#173d70;border:1px solid #dce4ee;border-radius:12px;font-size:14px;line-height:1.15;font-weight:900;box-shadow:0 1px 4px rgba(9,57,105,.025)}
.profile-choice.selected{background:#edf5ff;border:2px solid var(--blue);padding:12px 7px}
.profile-choice:active{background:#f2f7ff}
.profile-icon{display:flex;align-items:center;justify-content:center;height:60px}.profile-icon svg{width:75px;height:59px;stroke:#162a43;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.profile-text{display:block;overflow-wrap:anywhere}
/* Custom image icon selector; swipe horizontally */
.icon-picker{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.icon-choice{flex:0 0 auto;width:86px;height:86px;border:1.5px solid #d5e1ef;background:#fff;border-radius:12px;display:grid;place-items:center;padding:3px;scroll-snap-align:start}
.icon-choice.selected{border:2px solid var(--blue);padding:2px;background:#f4f8ff;box-shadow:0 0 0 2px #dceaff}
.icon-choice img{width:76px;height:76px;display:block;object-fit:cover;border-radius:9px}
.option-panel{margin:10px 0 14px;padding:13px;background:#f8fafd;border:1px solid #e0e8f2;border-radius:12px}
.option-panel[hidden]{display:none!important}
.tiny-btn{font-size:13px;padding:10px 12px}
.saved-profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.saved-profile-btn{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 7px;text-align:center;color:#153e71;font-size:13px;font-weight:900;line-height:1.25;border:1px solid #dce6f0;border-radius:11px;background:#fff;overflow-wrap:anywhere}
.saved-profile-btn img{width:78px;height:78px;object-fit:cover;border-radius:10px}
.saved-profile-btn .profile-fallback{width:78px;height:78px;display:grid;place-items:center;font-size:32px}
.saved-profile-btn small{font-size:10px;font-weight:700;color:#7e8da1}
.saved-profile-btn:active{background:#eff5ff}
.saved-profiles-empty{font-size:12px;color:#718097}
@media(min-width:650px){.mast{padding:26px 24px 22px}.shell main{padding:19px 10px 0}.card{padding:24px}.modal{padding:25px}.actions .btn{font-size:14px}}
@media(max-width:370px){.mast{padding-left:14px;padding-right:14px}.card{padding:16px}.profile-choice{min-height:106px;font-size:13px}.identity{font-size:11px}.test-version{font-size:9px;padding:6px}.site-photo img{width:41px;height:41px}}
@media(prefers-reduced-motion:reduce){.progress-inner{transition:none}}

</style>
</head>

<script>
(function(){'use strict';
  const KEY='training-tracker-v1';
  const $=id=>document.getElementById(id);
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const makeId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
  let state={trainings:[],activeId:null,groups:{store:[],managers:[],cat5:[],bakery:[],freshness:[],nonfood:[],mentors:[]},customLists:[],profileAbsences:{},formerColleagues:[]},lastUndo=null,completedExpanded=false,toastTimer=null,previousFocus=null;
  function isValidDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s+'T12:00:00'))&&new Date(s+'T12:00:00').toISOString().slice(0,10)===s}
  function cleanNames(raw){const seen=new Set();return (Array.isArray(raw)?raw:[]).filter(x=>typeof x==='string').map(x=>x.trim().slice(0,120)).filter(x=>{const k=x.toLocaleLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,500)}
  function normalise(raw){if(!raw||!Array.isArray(raw.trainings))return null;const trainings=[];const ids=new Set();for(const t of raw.trainings.slice(0,1000)){if(!t||typeof t.title!=='string'||!t.title.trim())continue;let id=typeof t.id==='string'&&t.id.length<120?t.id:makeId();if(ids.has(id))id=makeId();ids.add(id);const seen=new Set();const people=[];for(const p of Array.isArray(t.people)?t.people.slice(0,5000):[]){if(!p||typeof p.name!=='string'||!p.name.trim())continue;const key=p.name.trim().toLocaleLowerCase();if(seen.has(key))continue;seen.add(key);people.push({id:typeof p.id==='string'&&p.id.length<120?p.id:makeId(),name:p.name.trim().slice(0,120),done:p.done===true,completedAt:typeof p.completedAt==='string'?p.completedAt:'',note:typeof p.note==='string'?p.note.slice(0,240):'',absence:(p.absence&&['sick','holiday'].includes(p.absence.type)&&(p.absence.until==null||p.absence.until===''||isValidDate(p.absence.until)))?{type:p.absence.type,until:p.absence.until}:null});}trainings.push({id,title:t.title.trim().slice(0,150),due:isValidDate(t.due)?t.due:'',people,archived:t.archived===true});}return{trainings,profileAbsences:(raw.profileAbsences&&typeof raw.profileAbsences==='object'&&!Array.isArray(raw.profileAbsences))?raw.profileAbsences:{},formerColleagues:cleanNames(raw.formerColleagues),activeId:trainings.some(t=>t.id===raw.activeId)?raw.activeId:(trainings[0]?.id||null),groups:{store:cleanNames(raw.groups?.store),managers:cleanNames(raw.groups?.managers),cat5:cleanNames(raw.groups?.cat5),bakery:cleanNames(raw.groups?.bakery),freshness:cleanNames(raw.groups?.freshness),nonfood:cleanNames(raw.groups?.nonfood),mentors:cleanNames(raw.groups?.mentors)},customLists:(Array.isArray(raw.customLists)?raw.customLists:[]).filter(c=>c&&typeof c.name==='string'&&c.name.trim()).slice(0,100).map(c=>({id:typeof c.id==='string'?c.id:makeId(),name:c.name.trim().slice(0,120),created:isValidDate(c.created)?c.created:new Date().toISOString().slice(0,10),names:cleanNames(c.names),iconId:typeof c.iconId==='string'?c.iconId:'',buttonText:typeof c.buttonText==='string'?c.buttonText.trim().slice(0,120):''}))}}
  try{const raw=localStorage.getItem(KEY);if(raw)state=normalise(JSON.parse(raw))||state}catch(e){console.warn('Could not read saved training',e)}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){showToast('Unable to save. Check browser storage.');return false}}
  function active(){return state.trainings.find(t=>t.id===state.activeId&&!t.archived)||null}
  function currentCourses(){return state.trainings.filter(t=>!t.archived)}
  function profileKey(name){return name.trim().toLocaleLowerCase()}
  function getAbsence(p){return state.profileAbsences[profileKey(p.name)]||p.absence||null}
  function setAbsence(p,a){const key=profileKey(p.name);if(a)state.profileAbsences[key]=a;else delete state.profileAbsences[key];for(const t of state.trainings)for(const q of t.people)if(profileKey(q.name)===key)q.absence=a}
  function reconcileActive(){if(!active())state.activeId=currentCourses()[0]?.id||null}
  
  function fmtDate(iso){if(!isValidDate(iso))return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
  function dueStatus(iso){if(!iso)return'';const n=daysUntil(iso);return n<=3?'overdue':n<=7?'today':''}
  function shortDue(iso){const st=dueStatus(iso);return st==='overdue'?'Overdue · '+fmtDate(iso):st==='today'?'Due today · '+fmtDate(iso):'Deadline · '+fmtDate(iso)}
  function render(){for(const t of state.trainings)for(const p of t.people){const k=profileKey(p.name);if(!state.profileAbsences[k]&&p.absence)state.profileAbsences[k]=p.absence;else if(state.profileAbsences[k])p.absence=state.profileAbsences[k]}reconcileActive();const selected=active();const selector=$('courseSelect');selector.innerHTML=currentCourses().length?currentCourses().map(t=>'<option value="'+escapeHTML(t.id)+'" '+(t.id===state.activeId?'selected':'')+'>'+escapeHTML(t.title)+'</option>').join(''):'<option value="">No training added</option>';selector.hidden=!currentCourses().length;$('emptyTrainingChoice').hidden=!!currentCourses().length;selector.disabled=!currentCourses().length;$('editCourse').hidden=!selected;$('headerMessage').textContent=selected?currentCourses().length+' training '+(currentCourses().length===1?'course':'courses')+' saved on this device.':'Stay on top of colleague training.';
    const main=$('mainContent');if(!selected){main.innerHTML='<section class="card blank"><div class="blank-icon" aria-hidden="true">📋</div><h1>Start your training list</h1><p>Add a training course, set a deadline, then paste your colleague names. Tick someone off and they disappear from the outstanding list.</p><button class="btn primary" id="startCourse" type="button">+ Create training</button><button class="btn secondary" id="manageGroups" type="button">⚙ Manage default colleague lists</button></section><p class="footnote">Training is saved to this browser, not to a shared online database.</p>';return}
    const done=selected.people.filter(p=>p.done),pending=selected.people.filter(p=>!p.done).sort((a,b)=>Number(absenceAtBottom(a))-Number(absenceAtBottom(b))),total=selected.people.length,pct=total?Math.round(done.length/total*100):0;
    const pendingList=pending.length?'<div class="person-list">'+pending.map(p=>personHTML(p,false)).join('')+'</div>':'<div class="empty-list"><div class="celebrate">'+(total?'🎉':'👥')+'</div><strong>'+(total?'Everyone is complete!':'No colleagues added yet')+'</strong>'+(total?'All names are ticked off.':'Use “Add colleagues” to create your list.')+'</div>';
    main.innerHTML='<section class="card"><div class="eyebrow">Training course</div><h1 class="course-name">'+escapeHTML(selected.title)+'</h1><div class="due '+dueStatus(selected.due)+'">'+(selected.due?('◷ '+escapeHTML(shortDue(selected.due))):'◷ No deadline set')+'</div><div class="progress-head"><div class="fraction">'+done.length+'<small> / '+total+'</small></div><div class="progress-desc">COMPLETED<br>'+pending.length+' outstanding</div></div><div class="progress-outer" role="progressbar" aria-label="Training completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="progress-inner" style="width:'+pct+'%"></div></div><div class="actions"><button type="button" class="btn secondary" id="addPeople">＋ Add colleagues</button><button type="button" class="btn green" id="publish" >↗ Publish</button></div></section>'+

  // Conservative import checks: only discard clearly non-person prose.

  const nicknameWords=new Set(['monkey','donkey','tiger','bear','fox','boss','king','queen','banana','chief','buddy','mate','big man','little man','unknown','someone','staff','team','manager']);
  function classifyImport(name,original,roster){
    const n=name.trim(),lower=n.toLocaleLowerCase(),words=n.split(/\s+/);
    if(roster.has(lower))return 'name';
    if(/^(?:hi|hello|hey|morning|afternoon|evening|dear|thanks|thank you|please|regards|cheers)\b/i.test(n)||
       /\b(?:guys below|here is|here are|the following|an update|training[s]? for this|colleagues (?:are|who|have|need)|to complete|to comple|this month|see below|please (?:complete|do)|has(?:n't| not)? completed)\b/i.test(n)||
       /[.!?]$/.test(n)&&words.length>=5||
       words.length>=7)return 'ignore';
    if(nicknameWords.has(lower)||/^(?:nickname|aka)\b/i.test(n)||/\b(?:the donkey|the monkey)\b/i.test(n))return 'review';
    if(words.length>=4||/\d/.test(n)&&!roster.has(lower))return 'review';
    return 'name';
  }

  function parseLines(raw){
    const entries=[], ignored=[],review=[];
    const lines=String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const hasStatus=lines.some(s=>/[☑✅✔✓🔴❌]/u.test(s));
    const roster=new Set([...Object.values(state.groups).flat(),...(state.customLists||[]).flatMap(c=>c.names),...(active()?.people||[]).map(p=>p.name)].map(n=>n.toLocaleLowerCase()));
    const timing=/\b(?:today|tonight|tomorrow|yesterday|next\s+week|this\s+week|next\s+(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)|(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?))\b/i;
    const noteWords=/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?/i;
    for(let i=0;i<lines.length;i++){
      const original=lines[i];
      if(/^\d+\s*\/\s*\d+(?:\s+completed)?$/i.test(original)||/^(?:completed|outstanding|deadline|remaining|still to complete|training)\s*:/i.test(original)||/^(?:still to complete|completed colleagues)$/i.test(original)){ignored.push(original);continue}
      const icons=/[☑✅✔✓🔴❌]/u.test(original);
      let line=original.replace(/^[\s\-*•]+/,'').replace(/[☑✅✔✓🔴❌\uFE0E\uFE0F]/gu,'').replace(/^\*+(?=\S)/,'').trim();
      if(!line){ignored.push(original);continue}
      // Headings such as "LOS Video 6 Minutes:", "*Modern slavery*" and "Training: Food safety"
      // are not colleagues. Only use stronger title cues so unusual real names survive.
      if(!icons&&!roster.has(line.toLocaleLowerCase())&&(
        (i===0&&hasStatus&&/^\*[^*]+\*$/.test(original))||
        (i===0&&hasStatus&&/^(?:modern slavery|food safety|manual handling|health and safety|six monthly refresher|6 monthly refresher)$/i.test(line))||
        /^(?:training|course|module|subject)\s*[:\-]/i.test(line)||
        /^(?:los|health\s*(?:and|&)\s*safety|food\s+safety|modern\s+slavery)\b.*(?:video|minutes?|training|refresher|:)\s*:?\s*$/i.test(line)||
        /^(?:.+\b(?:video|training|refresher|induction)\b.{0,50}:)$/i.test(line)
      )){ignored.push(original);continue}
      const done=/[☑✅✔✓]/u.test(original)&&!/[🔴❌]/u.test(original);
      let note='';
      const starred=line.match(/\s+\*([^*]+)\*\s*$/);
      if(starred){note=starred[1].trim();line=line.slice(0,starred.index).trim()}
      else{
        const dash=line.match(/\s+[-–—]\s+(.+)$/);
        if(dash){note=dash[1].trim();line=line.slice(0,dash.index).trim()}
      }
      // "Katie Sunday", "Nicholas *Friday*", "April to do tomorrow" =>
      // keep the colleague name, store when they intend to do it as a note.
      if(!note){
        const parts=line.split(/\s+/);
        for(let cut=1;cut<parts.length;cut++){
          const candidate=parts.slice(cut).join(' ').replace(/^[,;:() ]+|[,;:() ]+$/g,'');
          if(timing.test(candidate)&&noteWords.test(candidate)&&/^(?:(?:to\s+do|due|booked|scheduled|complete|completed|finish|finishing|on|by|for|needs?\s+to\s+do)\s+)?(?:(?:this|next)\s+)?(?:mon(?:day)?|tues(?:day)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?|today|tonight|tomorrow|yesterday|week)(?:\s+.*)?$/i.test(candidate)){
            const base=parts.slice(0,cut).join(' ');
            // avoid splitting a known full colleague name
            if(!roster.has(line.toLocaleLowerCase())&&(roster.has(base.toLocaleLowerCase())||cut===1||/^(?:to|on|by|for|due|next|this)\b/i.test(parts[cut]))){
              line=base;note=candidate;break;
            }
          }
        }
      }
      line=line.replace(/^\*+|\*+$/g,'').trim();
      if(!line||/^\d+\s*\/\s*\d+$/.test(line)){ignored.push(original);continue}
      const decision=classifyImport(line,original,roster);
      if(decision==='ignore'){ignored.push(original);continue}
      (decision==='review'?review:entries).push({name:line.slice(0,120),done,note:note.slice(0,240)});

    }
    return {entries,review,skipped:ignored.length,ignored};
  }

  function customListButtonLabel(list){return (list?.buttonText||'').trim()||(list?.name||'').trim()}
  function customListDisplayLabel(list,withDate=false){if(!list)return '';const base=customListButtonLabel(list)||list.name;return withDate?base+' (created '+fmtDate(list.created)+')':base}
  function iconPickerHTML(inputId,pickerId,selectedId=''){return '<div class="field"><label>Choose an icon (optional)</label><input type="hidden" id="'+inputId+'" value="'+escapeHTML(selectedId||'')+'"><div class="icon-picker" id="'+pickerId+'">'+customIconLibrary.map(icon=>'<button type="button" class="icon-choice'+(icon.id===selectedId?' selected':'')+'" data-icon-id="'+icon.id+'" aria-label="Choose icon"><img src="'+icon.src+'" alt=""></button>').join('')+'</div><p class="hint">Scroll the icons and tap one to use it. Writing is optional.</p></div>'}
  function bindIconPicker(pickerId,inputId){const picker=$(pickerId),input=$(inputId);if(!picker||!input)return;picker.onclick=e=>{const button=e.target.closest('[data-icon-id]');if(!button)return;const next=button.dataset.iconId;const same=input.value===next;input.value=same?'':next;picker.querySelectorAll('[data-icon-id]').forEach(el=>el.classList.toggle('selected',!same&&el===button));};}
  function bindOptionalButtonText(toggleId,wrapId,inputId,prefill=''){const toggle=$(toggleId),wrap=$(wrapId),input=$(inputId);if(!toggle||!wrap||!input)return;const sync=()=>{const has=input.value.trim().length>0;wrap.hidden=!has && !wrap.dataset.forceOpen;toggle.textContent=has||wrap.dataset.forceOpen==='true'?'Hide button text':'Add / edit button text';};toggle.onclick=()=>{wrap.dataset.forceOpen=wrap.hidden?'true':'false';wrap.hidden=!wrap.hidden;if(!wrap.hidden)setTimeout(()=>input.focus(),30);sync();};if(prefill){wrap.hidden=false;wrap.dataset.forceOpen='true';}input.addEventListener('input',sync);sync();}

  // Event delegation keeps controls working after every screen refresh.
  $('mainContent').addEventListener('click',e=>{const row=e.target.closest('[data-person-row]');if(!row||e.target.closest('button'))return;const now=Date.now(),id=row.dataset.personRow;if(id===tapPersonId&&now-tapAt<650)tapCount++;else tapCount=1;tapPersonId=id;tapAt=now;if(tapCount>=3){tapCount=0;showAbsenceChoice(id)}});
  $('mainContent').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.toggle){togglePerson(button.dataset.toggle);return}if(button.dataset.edit){editPerson(button.dataset.edit);return}switch(button.id){case 'startCourse':showCourseModal();break;case 'loadExample':loadExample();break;case 'addPeople':showPeopleModal();break;case 'publish':showPublish();break;case 'toggleCompleted':completedExpanded=!completedExpanded;render();break;case 'openData':showData();break;case 'manageGroups':showGroupEditor();break;case 'colleagueOverview':showColleagueOverview();break;case 'staffManage':showStaffManager();break;case 'availableOnly':button.dataset.available=button.dataset.available==='true'?'false':'true';button.textContent='Show available only: '+(button.dataset.available==='true'?'On':'Off');updateSearch();break;}});
  $('emptyTrainingChoice').onclick=()=>{openModal(modalHeader('No current training added')+'<p style="font-size:17px;margin:8px 0 20px">Add one?</p><button type="button" class="btn primary" id="confirmAddCourse">Add training</button><button type="button" class="btn secondary" data-close>Cancel</button>');$('confirmAddCourse').onclick=()=>{closeModal();showCourseModal()}};
  $('mainContent').addEventListener('input',e=>{if(e.target.id==='nameSearch')updateSearch()});
  $('overviewButton').onclick=showOverview;
  $('newCourse').onclick=()=>showCourseModal();$('editCourse').onclick=()=>showCourseModal(true);$('courseSelect').onchange=e=>{state.activeId=e.target.value;completedExpanded=false;save();render()};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')||e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});$('toastAction').onclick=()=>{const a=$('toastAction')._action;if(a)a()};
  $('restoreInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>3_000_000)throw Error('Backup is too large');const data=JSON.parse(await file.text()),restored=normalise(data);if(!restored)throw Error('Invalid backup');if(!confirm('Restore '+restored.trainings.length+' training courses? This replaces all current training on this device.'))return;state=restored;completedExpanded=false;save();closeModal();render();showToast('Backup restored')}catch(err){showToast('Could not restore: '+(err.message||'invalid file'))}});
  function showToast(msg,actionText,action){clearTimeout(toastTimer);$('toastText').textContent=msg;$('toast').hidden=false;const b=$('toastAction');b.hidden=!actionText;b.textContent=actionText||'';b._action=action||null;toastTimer=setTimeout(()=>{$('toast').hidden=true;b._action=null},actionText?8500:3400)}
  render();
})();
</script>
</body>
</html>
